<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://hbloyloryxksbsornjlg.supabase.co wss://hbloyloryxksbsornjlg.supabase.co; img-src 'self' data: blob: https://hbloyloryxksbsornjlg.supabase.co; frame-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>KWEIDER Screen Control — Secure Admin V2</title>
<style>
:root{--gold:#c5a059;--gold2:#f3d98d;--bg:#080808;--line:#332b20;--muted:#a99d89;--ok:#8fca88;--warn:#e5ba67;--bad:#e09191}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif;color:#fff}.hidden{display:none!important}
#loginView{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#1b140b 0,#090909 40%,#050505 100%);padding:20px}
.login-card{width:min(440px,100%);background:#0d0d0d;border:1px solid #493c27;border-radius:18px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.brand{font-weight:900;letter-spacing:.19em;color:var(--gold2);font-size:20px}.kicker{margin:7px 0 22px;color:var(--muted);font-size:12px}.field{margin-bottom:13px}.field label{display:block;color:#d1c4ab;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid #403522;border-radius:10px;background:#080808;color:#fff;font:inherit;outline:none}.field input:focus{border-color:var(--gold)}
.login-btn,.bar-btn{border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.login-btn{width:100%;margin-top:7px;background:linear-gradient(135deg,#8c6510,#d2af45);color:#080808}.login-btn:disabled{opacity:.55;cursor:wait}.login-status{min-height:18px;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.4}.login-status.bad{color:var(--bad)}
#secureApp{height:100%;display:grid;grid-template-rows:52px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0b0b;z-index:30}.top-left,.top-right{display:flex;align-items:center;gap:10px;min-width:0}.secure-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #3d5138;border-radius:999px;padding:5px 9px;color:#bfe2b8;font-size:11px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(143,202,136,.55)}.admin-email{font-size:12px;color:#c7b99e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px}.cloud-state{font-size:11px;color:var(--muted);white-space:nowrap}.bar-btn{padding:7px 10px;background:#12100d;color:#e7d49d;font-size:11px}.bar-btn.danger{border-color:#633d3d;color:#e9acac}.bar-btn:hover{filter:brightness(1.12)}
#appFrame{display:block;width:100%;height:100%;border:0;background:#080808}.toast{position:fixed;right:18px;top:66px;z-index:900;max-width:440px;border:1px solid #504329;border-radius:11px;padding:11px 13px;background:#11100d;color:#e9dbb6;font-size:12px;box-shadow:0 18px 55px rgba(0,0,0,.55);opacity:0;transform:translateY(-7px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.toast.ok{border-color:#385237;color:#c5e4be}.toast.bad{border-color:#673f3f;color:#efb0b0}
@media(max-width:700px){#secureApp{grid-template-rows:auto 1fr}.topbar{padding:8px 10px;align-items:flex-start}.top-left{flex-direction:column;align-items:flex-start;gap:4px}.cloud-state{display:none}.admin-email{max-width:180px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="brand">KWEIDER</div>
    <div class="kicker">Secure Street Display Control / لوحة إدارة الشاشات الآمنة</div>
    <form id="loginForm">
      <div class="field"><label>Admin email</label><input id="email" type="email" autocomplete="username" value="isweets.kw@gmail.com" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="login-btn" id="loginBtn" type="submit">Sign in / دخول</button>
    </form>
    <div class="login-status" id="loginStatus">Only authorised KWEIDER screen administrators can enter.</div>
  </div>
</div>

<div id="secureApp" class="hidden">
  <div class="topbar">
    <div class="top-left">
      <span class="secure-pill"><span class="dot"></span>SECURE ADMIN V2</span>
      <span class="admin-email" id="adminEmail"></span>
      <span class="cloud-state" id="cloudState">Connecting to secure storage…</span>
    </div>
    <div class="top-right">
      <button class="bar-btn" id="refreshCloud">Refresh cloud</button>
      <button class="bar-btn danger" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <iframe id="appFrame" title="KWEIDER secure screen admin V2"></iframe>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const SUPABASE_URL='https://hbloyloryxksbsornjlg.supabase.co';
const SUPABASE_KEY='sb_publishable_6oq2EgVDzMHkzxlRgwFdSw_MPU2DmaN';
const DRAFT_KEY='kweider-screen-admin-drafts-v1';
const BG_GLOBAL_KEY='kweider-screen-background-global-v1';
const BG_OVERRIDE_KEY='kweider-screen-background-overrides-v1';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let cloudDrafts={}, published={}, user=null, bound=false, toastTimer=null, bindTimer=null;

function notify(msg,type=''){const t=$('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3300)}
function setLoginStatus(msg,bad=false){$('loginStatus').textContent=msg;$('loginStatus').className='login-status'+(bad?' bad':'')}
function setCloudState(msg){$('cloudState').textContent=msg}
function safeJSON(v,fallback){try{const x=JSON.parse(v);return x??fallback}catch(e){return fallback}}
function extFromName(name){const m=(name||'').toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1].replace('jpeg','jpg'):'webp'}
function fileNameFromSrc(src){try{const u=new URL(src,location.href),n=u.pathname.split('/').pop();return n&&/\.(webp|png|jpe?g)$/i.test(n)?n:null}catch(e){return null}}
function currentId(doc){const b=doc&&doc.querySelector('.ad-btn.active'),m=b&&b.textContent.match(/Ad\s+(\d+)/i);return m?Number(m[1]):1}
function defaultOps(id){return {active:true,displayOrder:id,durationSec:7}}
function opsFor(id){const c=cloudDrafts[id]?.content||published[id]?.content||{};return {active:c.active!==false,displayOrder:Number(c.displayOrder??id),durationSec:Number(c.durationSec??7)}}
function stateFor(id){
  const d=cloudDrafts[id],p=published[id];
  if(!d&&!p)return {key:'original',label:'Original'};
  if(d&&!p)return {key:'draft',label:'Draft'};
  if(!d&&p)return {key:'published',label:'Published'};
  if(Number(d.version)===Number(p.source_version))return {key:'published',label:'Published'};
  return {key:'changed',label:'Changed'};
}
function nested(){
  try{
    const linked=$('appFrame').contentDocument;
    const cinematicFrame=linked&&linked.getElementById('manager');
    const cinematic=cinematicFrame&&cinematicFrame.contentDocument;
    const baseFrame=cinematic&&cinematic.getElementById('adminFrame');
    const base=baseFrame&&baseFrame.contentDocument;
    return {linked,cinematic,base,baseWindow:baseFrame&&baseFrame.contentWindow};
  }catch(e){return {linked:null,cinematic:null,base:null,baseWindow:null}}
}
async function signedDraftImage(path){if(!path)return null;const {data,error}=await db.storage.from('screen-drafts').createSignedUrl(path,3600);return error?null:data.signedUrl}
async function loadPublished(){
  const {data,error}=await db.from('screen_ads_public').select('id,content,source_version,published_at').order('id');
  if(error)throw error;published={};for(const r of data||[])published[r.id]=r;return data||[];
}
async function loadCloudDrafts(){
  setCloudState('Loading secure drafts…');
  const {data,error}=await db.from('screen_ads_draft').select('id,content,version,updated_at').order('id');
  if(error)throw error;
  cloudDrafts={};const merged={};
  for(const row of data||[]){
    const c=row.content||{},signed=c.imagePath?await signedDraftImage(c.imagePath):null;
    cloudDrafts[row.id]={...row,content:c,signedImage:signed};
    merged[row.id]={
      en:c.en||'',ar:c.ar||'',price:c.price||'',oldPrice:c.oldPrice||'',save:c.save||'',
      labelEn:c.labelEn||'',labelAr:c.labelAr||'',zoom:Number(c.zoom??1),x:Number(c.x??0),y:Number(c.y??0),
      imageMeta:c.imageMeta||null,previewImage:signed||c.previewImage||null
    };
    if(c.bgGlobal)localStorage.setItem(BG_GLOBAL_KEY,JSON.stringify(c.bgGlobal));
    if(c.bgOverrides)localStorage.setItem(BG_OVERRIDE_KEY,JSON.stringify(c.bgOverrides));
  }
  localStorage.setItem(DRAFT_KEY,JSON.stringify(merged));
  setCloudState(`${(data||[]).length} secure draft${(data||[]).length===1?'':'s'} loaded`);
  return data||[];
}
async function refreshData(){await Promise.all([loadCloudDrafts(),loadPublished()]);refreshUI()}
async function authorize(u){
  const {data,error}=await db.from('screen_admins').select('role').eq('user_id',u.id).maybeSingle();
  if(error)throw error;if(!data||data.role!=='admin')throw new Error('This account is not authorised for KWEIDER Screen Control.');
  user=u;$('adminEmail').textContent=u.email||'Admin';await Promise.all([loadCloudDrafts(),loadPublished()]);
  $('loginView').classList.add('hidden');$('secureApp').classList.remove('hidden');bound=false;$('appFrame').src='screen-admin-linked-bg.html';
}
async function signIn(email,password){
  $('loginBtn').disabled=true;setLoginStatus('Signing in securely…');
  try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await authorize(data.user);setLoginStatus('Signed in.')}
  catch(e){await db.auth.signOut().catch(()=>{});setLoginStatus(e.message||'Unable to sign in.',true)}
  finally{$('loginBtn').disabled=false}
}

function injectOps(base){
  if(base.getElementById('kOpsBox'))return;
  const style=base.createElement('style');style.id='kOpsStyle';style.textContent=`
    .k-ops{margin-top:14px;border:1px solid #433720;border-radius:12px;padding:13px;background:#0b0a08}
    .k-ops-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
    .k-ops-title{font-size:13px;font-weight:800;color:#f0d78d}.k-state{border:1px solid #4b4030;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}
    .k-state.original{color:#aaa}.k-state.draft{color:#e8c66e;border-color:#745e29}.k-state.changed{color:#f2a56e;border-color:#794629}.k-state.published{color:#a9dba1;border-color:#3f6239}
    .k-ops-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.k-op label{display:block;color:#bfb39e;font-size:11px;margin-bottom:6px}.k-op input[type=number]{width:100%;background:#090909;border:1px solid #302a20;color:#fff;border-radius:9px;padding:9px}
    .k-toggle{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border:1px solid #302a20;border-radius:9px;background:#090909}.k-toggle input{accent-color:#c5a059;width:17px;height:17px}.k-toggle span{font-size:12px;font-weight:700}
    .k-op-note{margin-top:9px;color:#9f947f;font-size:10px;line-height:1.45}.k-inactive{opacity:.53!important}
    .ad-btn.k-published{border-color:#365431!important}.ad-btn.k-changed{border-color:#74452f!important}.ad-btn.k-draft{border-color:#6d5829!important}
    @media(max-width:700px){.k-ops-grid{grid-template-columns:1fr}}
  `;base.head.appendChild(style);
  const actions=base.querySelector('.actions');if(!actions)return;
  const box=base.createElement('div');box.id='kOpsBox';box.className='k-ops';box.innerHTML=`
    <div class="k-ops-head"><div class="k-ops-title">Display control / إعدادات العرض</div><span class="k-state original" id="kState">Original</span></div>
    <div class="k-ops-grid">
      <div class="k-op"><label>Active / تشغيل الإعلان</label><div class="k-toggle"><input id="kActive" type="checkbox" checked><span id="kActiveText">Active</span></div></div>
      <div class="k-op"><label>Display order / الترتيب</label><input id="kOrder" type="number" min="1" max="999" step="1" value="1"></div>
      <div class="k-op"><label>Duration / المدة (seconds)</label><input id="kDuration" type="number" min="4" max="30" step="1" value="7"></div>
    </div>
    <div class="k-op-note">These settings are stored with the Draft and versioned on Publish. Inactive ads will be excluded when the physical display is connected to Published data.</div>`;
  actions.insertAdjacentElement('beforebegin',box);
  ['kActive','kOrder','kDuration'].forEach(id=>base.getElementById(id).addEventListener('input',()=>{
    if(id==='kActive')base.getElementById('kActiveText').textContent=base.getElementById('kActive').checked?'Active':'Inactive';
    base.getElementById('status').textContent='Unsaved changes.';
  }));
}
function loadOps(base){
  const id=currentId(base),o=opsFor(id),s=stateFor(id);
  if(!base.getElementById('kOpsBox'))injectOps(base);
  base.getElementById('kActive').checked=o.active;base.getElementById('kActiveText').textContent=o.active?'Active':'Inactive';
  base.getElementById('kOrder').value=o.displayOrder;base.getElementById('kDuration').value=o.durationSec;
  const p=base.getElementById('kState');p.textContent=s.label;p.className='k-state '+s.key;
}
function refreshSidebar(base){
  if(!base)return;
  const buttons=[...base.querySelectorAll('.ad-btn')],list=base.getElementById('adList');
  buttons.forEach(btn=>{
    const m=btn.textContent.match(/Ad\s+(\d+)/i);if(!m)return;const id=Number(m[1]),s=stateFor(id),o=opsFor(id);
    btn.classList.remove('k-published','k-changed','k-draft','k-inactive');if(s.key!=='original')btn.classList.add('k-'+s.key);if(!o.active)btn.classList.add('k-inactive');
    let small=btn.querySelector('small');if(!small){small=base.createElement('small');btn.appendChild(small)}
    small.textContent=`${s.label} · ${o.active?'Active':'Inactive'} · #${o.displayOrder} · ${o.durationSec}s`;btn.dataset.order=String(o.displayOrder);
  });
  if(list)buttons.sort((a,b)=>Number(a.dataset.order||999)-Number(b.dataset.order||999)||Number((a.textContent.match(/Ad\s+(\d+)/i)||[])[1]||0)-Number((b.textContent.match(/Ad\s+(\d+)/i)||[])[1]||0)).forEach(b=>list.appendChild(b));
}
function refreshUI(){const {base}=nested();if(!base)return;loadOps(base);refreshSidebar(base);const id=currentId(base),s=stateFor(id);setCloudState(`Ad ${id} · ${s.label}${cloudDrafts[id]?` · Draft v${cloudDrafts[id].version}`:''}`)}

function gatherContent(base,id){
  const val=n=>base.getElementById(n)?.value||'',existing=cloudDrafts[id]?.content||published[id]?.content||{},img=base.getElementById('pImg');
  const meta=img?.dataset.tempMeta?safeJSON(img.dataset.tempMeta,null):(existing.imageMeta||null),defaults=defaultOps(id);
  return {
    ...existing,en:val('titleEn'),ar:val('titleAr'),price:val('price'),oldPrice:val('oldPrice'),save:val('save'),labelEn:val('labelEn'),labelAr:val('labelAr'),
    zoom:Number(val('zoom')||1),x:Number(val('posX')||0),y:Number(val('posY')||0),
    active:base.getElementById('kActive')?.checked??existing.active??defaults.active,
    displayOrder:Math.max(1,Number(base.getElementById('kOrder')?.value||existing.displayOrder||defaults.displayOrder)),
    durationSec:Math.min(30,Math.max(4,Number(base.getElementById('kDuration')?.value||existing.durationSec||defaults.durationSec))),
    imagePath:existing.imagePath||null,publicImagePath:existing.publicImagePath||null,publicImageUrl:existing.publicImageUrl||null,imageMeta:meta,
    img:existing.img||fileNameFromSrc(img?.src)||null,bgGlobal:safeJSON(localStorage.getItem(BG_GLOBAL_KEY),existing.bgGlobal||{theme:'luxury-black',color:'#050505'}),bgOverrides:safeJSON(localStorage.getItem(BG_OVERRIDE_KEY),existing.bgOverrides||{})
  };
}
async function uploadSelectedImage(base,id,content){
  const input=base.getElementById('imageFile'),file=input?.files?.[0];if(!file)return content;
  const ext=extFromName(file.name),path=`ad-${id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;base.getElementById('status').textContent='Uploading image securely…';
  const {error}=await db.storage.from('screen-drafts').upload(path,file,{cacheControl:'3600',contentType:file.type||undefined,upsert:false});if(error)throw error;
  content.imagePath=path;content.publicImagePath=null;content.publicImageUrl=null;content.img=null;content.imageMeta=content.imageMeta||{name:file.name,type:file.type,size:file.size};input.value='';return content;
}
async function saveCloudDraft(opts={}){
  const {base}=nested();if(!base)throw new Error('Admin editor is not ready.');const id=currentId(base),status=base.getElementById('status');
  try{
    if(!opts.silent)status.textContent='Saving secure draft…';let content=gatherContent(base,id);content=await uploadSelectedImage(base,id,content);
    const {data,error}=await db.from('screen_ads_draft').upsert({id,content},{onConflict:'id'}).select('id,content,version,updated_at').single();if(error)throw error;cloudDrafts[id]={...data};
    const local=safeJSON(localStorage.getItem(DRAFT_KEY),{});let preview=base.getElementById('pImg')?.src||null;
    if(content.imagePath){const signed=await signedDraftImage(content.imagePath);if(signed)preview=signed;cloudDrafts[id].signedImage=signed}
    local[id]={en:content.en,ar:content.ar,price:content.price,oldPrice:content.oldPrice,save:content.save,labelEn:content.labelEn,labelAr:content.labelAr,zoom:content.zoom,x:content.x,y:content.y,imageMeta:content.imageMeta,previewImage:preview};localStorage.setItem(DRAFT_KEY,JSON.stringify(local));
    status.textContent=`Secure draft saved · version ${data.version}. Live display unchanged.`;if(!opts.silent)notify(`Ad ${id} saved securely to Supabase.`,'ok');refreshUI();return data;
  }catch(e){status.textContent='Draft save failed: '+(e.message||e);notify('Draft save failed: '+(e.message||e),'bad');throw e}
}
async function preparePublicImage(id,content){
  if(!content.imagePath)return content;const {data:blob,error:downloadError}=await db.storage.from('screen-drafts').download(content.imagePath);if(downloadError)throw downloadError;
  const ext=extFromName(content.imagePath),publicPath=`ad-${id}/current.${ext}`,oldPath=content.publicImagePath;
  const {error:uploadError}=await db.storage.from('screen-public').upload(publicPath,blob,{upsert:true,cacheControl:'3600',contentType:blob.type||undefined});if(uploadError)throw uploadError;
  if(oldPath&&oldPath!==publicPath)await db.storage.from('screen-public').remove([oldPath]).catch(()=>{});const {data:urlData}=db.storage.from('screen-public').getPublicUrl(publicPath);return {...content,publicImagePath:publicPath,publicImageUrl:urlData.publicUrl};
}
async function publishCurrent(){
  const {base}=nested();if(!base)return;const id=currentId(base),status=base.getElementById('status');
  if(!confirm(`Publish Ad ${id} to the protected Published data layer?\n\nThe physical street display is still NOT connected.`))return;
  try{
    status.textContent='Saving draft before publish…';let row=await saveCloudDraft({silent:true});status.textContent='Preparing public image…';const content=await preparePublicImage(id,row.content||{});
    if(JSON.stringify(content)!==JSON.stringify(row.content)){const {data,error}=await db.from('screen_ads_draft').update({content}).eq('id',id).select('id,content,version,updated_at').single();if(error)throw error;row=data;cloudDrafts[id]={...data}}
    status.textContent='Publishing secure data…';const {error}=await db.rpc('publish_screen_ad',{p_ad_id:id});if(error)throw error;
    await loadPublished();await loadCloudDrafts();status.textContent='Published to secure data layer. Physical street display unchanged.';notify(`Ad ${id} published securely. Version history updated.`,'ok');refreshUI();
  }catch(e){status.textContent='Publish failed: '+(e.message||e);notify('Publish failed: '+(e.message||e),'bad')}
}
function bindBase(){
  const {base}=nested();if(!base||!base.getElementById('saveDraft'))return false;injectOps(base);
  const save=base.getElementById('saveDraft');save.textContent='Save secure draft';save.onclick=e=>{e.preventDefault();saveCloudDraft()};
  const actions=save.parentElement;let pub=base.getElementById('securePublishV2');if(!pub){pub=base.createElement('button');pub.id='securePublishV2';pub.className='btn primary';pub.textContent='Publish secure data';pub.onclick=e=>{e.preventDefault();publishCurrent()};actions.insertBefore(pub,save.nextSibling)}
  const note=base.querySelector('.publish-note');if(note)note.innerHTML='<strong>Secure cloud mode:</strong> Content, images, Active/Inactive, display order and duration are stored in Supabase. Publish writes only to the protected Published data layer. The physical display remains unchanged until explicitly connected.';
  const sub=base.querySelector('.sidebar .sub');if(sub)sub.textContent='Street Display Content Manager — Secure Cloud V2';base.addEventListener('click',e=>{if(e.target.closest('.ad-btn'))setTimeout(()=>refreshUI(),160)});bound=true;refreshUI();return true;
}
function waitForAdmin(){clearInterval(bindTimer);bindTimer=setInterval(()=>{if(bindBase())clearInterval(bindTimer)},180)}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();signIn($('email').value.trim(),$('password').value)});
$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
$('refreshCloud').onclick=async()=>{try{await refreshData();const {base}=nested();if(base)base.defaultView.location.reload();notify('Secure cloud data refreshed.','ok')}catch(e){notify('Refresh failed: '+(e.message||e),'bad')}};
$('appFrame').addEventListener('load',()=>{bound=false;waitForAdmin()});db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')user=null});
(async()=>{const {data:{session}}=await db.auth.getSession();if(session?.user){try{await authorize(session.user)}catch(e){await db.auth.signOut().catch(()=>{});setLoginStatus(e.message||String(e),true)}}})();
})();
</script>
</body>
</html>

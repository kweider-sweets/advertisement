<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>KWEIDER Screen Control V3.4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}#host{display:block;width:100%;height:100%;border:0;background:#080808}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><iframe id="host" src="screen-admin-control-v22.html?v=34" title="KWEIDER Screen Control V3.4"></iframe><script>(()=>{'use strict';const host=document.getElementById('host');const URL='https://hbloyloryxksbsornjlg.supabase.co',KEY='sb_publishable_6oq2EgVDzMHkzxlRgwFdSw_MPU2DmaN';const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let bound=false,lastId=null,loading=false;
const FONT_DEFAULTS={badge:34,en:100,ar:72,old:47,price:182,footerAr:43,footerEn:31};const MOTION_KEYS=['badge','title','price','footer','image'];const EFFECTS=[['default','Default Cinematic'],['fade','Fade'],['zoom-in','Zoom In'],['zoom-out','Zoom Out'],['left','From Left'],['right','From Right'],['up','Rise Up'],['soft-pop','Soft Pop'],['cinematic','Cinematic Sweep']];
function docs(){try{const v22=host.contentDocument;if(!v22)return{};const v21=v22.getElementById('host')?.contentDocument;if(!v21)return{};const control=v21.getElementById('host')?.contentDocument;if(!control)return{};const secure=control.getElementById('frame')?.contentDocument;if(!secure)return{};const linked=secure.getElementById('appFrame')?.contentDocument;if(!linked)return{};const cinematic=linked.getElementById('manager')?.contentDocument;if(!cinematic)return{};const bf=cinematic.getElementById('adminFrame');return{control,base:bf?.contentDocument||null,baseWindow:bf?.contentWindow||null}}catch(e){return{}}}
function currentId(base){const b=base?.querySelector('.ad-btn.active'),m=b?.textContent.match(/Ad\s+(\d+)/i);return m?Number(m[1]):1}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function num(v,d){const n=Number(v);return Number.isFinite(n)?n:d}
function defaults(){const motion={};MOTION_KEYS.forEach(k=>motion[k]={effect:'default',duration:.7,delay:0});return{fontSizes:{...FONT_DEFAULTS},motion}}
function addStyles(base){if(base.getElementById('kVisualStyle'))return;const s=base.createElement('style');s.id='kVisualStyle';s.textContent=`.k-visual{margin-top:14px;border:1px solid #4b3d22;border-radius:12px;background:#0b0a08;overflow:hidden}.k-vsum{cursor:pointer;padding:12px 13px;color:#f0d78d;font-size:13px;font-weight:800;user-select:none}.k-vbody{padding:0 13px 13px}.k-vtitle{font-size:11px;color:#a99d89;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 8px}.k-fontgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.k-font label{display:flex;justify-content:space-between;color:#c8bda8;font-size:10px;margin-bottom:4px}.k-font input{width:100%;accent-color:#c5a059}.k-motion-head,.k-motion-row{display:grid;grid-template-columns:1.05fr 1.45fr .8fr .8fr;gap:7px;align-items:center}.k-motion-head{font-size:9px;color:#897e6b;margin:8px 0 5px}.k-motion-row{margin-bottom:7px}.k-motion-row span{font-size:10px;color:#d1c3a8}.k-motion-row select,.k-motion-row input{width:100%;background:#090909;border:1px solid #302a20;color:#fff;border-radius:7px;padding:7px 6px;font-size:10px}.k-vactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.k-vbtn{border:1px solid #80692f;border-radius:8px;padding:8px 10px;background:#12100c;color:#e8d38f;font-size:10px;font-weight:800;cursor:pointer}.k-vbtn.primary{background:linear-gradient(135deg,#805e12,#c9a640);color:#080706}.k-vstatus{font-size:10px;color:#9f947f;margin-top:8px;min-height:14px}@media(max-width:700px){.k-fontgrid{grid-template-columns:1fr}.k-motion-head,.k-motion-row{grid-template-columns:1fr 1.2fr .8fr .8fr}}`;base.head.appendChild(s)}
function ensureUI(base){if(base.getElementById('kVisualBox'))return;addStyles(base);const actions=base.querySelector('.actions');if(!actions)return;const d=base.createElement('details');d.id='kVisualBox';d.className='k-visual';d.open=false;const opts=EFFECTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');const fontRows=Object.entries({badge:'Badge',en:'English title',ar:'Arabic title',old:'Secondary line',price:'Price',footerAr:'Arabic footer',footerEn:'English footer'}).map(([k,l])=>`<div class="k-font"><label>${l}<b id="kv_${k}_v"></b></label><input id="kv_${k}" data-font="${k}" type="range" min="${k==='price'?90:18}" max="${k==='price'?240:k==='en'?140:110}" step="1"></div>`).join('');const motionRows=MOTION_KEYS.map(k=>`<div class="k-motion-row"><span>${k[0].toUpperCase()+k.slice(1)}</span><select id="km_${k}_effect">${opts}</select><input id="km_${k}_duration" type="number" min="0.15" max="2.5" step="0.05"><input id="km_${k}_delay" type="number" min="0" max="3" step="0.05"></div>`).join('');d.innerHTML=`<summary class="k-vsum">Advanced Visual Controls / الخط والحركة السينمائية</summary><div class="k-vbody"><div class="k-vtitle">Typography / حجم الخط لكل سطر</div><div class="k-fontgrid">${fontRows}</div><div class="k-vtitle">Entrance motion / طريقة الظهور</div><div class="k-motion-head"><span>Element</span><span>Effect</span><span>Duration</span><span>Delay</span></div>${motionRows}<div class="k-vactions"><button type="button" class="k-vbtn" id="kPreviewMotion">Preview Motion</button><button type="button" class="k-vbtn" id="kResetVisual">Reset to V11</button><button type="button" class="k-vbtn primary" id="kSaveVisual">Save Visual Settings</button></div><div class="k-vstatus" id="kVisualStatus">V11 defaults are preserved until you save changes.</div></div>`;actions.parentNode.insertBefore(d,actions);d.querySelectorAll('[data-font]').forEach(x=>x.addEventListener('input',()=>{d.querySelector('#'+x.id+'_v').textContent=x.value+' px';applyPreview(base,readUI(base))}));d.querySelectorAll('select,input[type=number]').forEach(x=>x.addEventListener('input',()=>applyPreview(base,readUI(base))));base.getElementById('kPreviewMotion').onclick=()=>previewMotion(base,readUI(base));base.getElementById('kResetVisual').onclick=()=>{writeUI(base,defaults());applyPreview(base,defaults());base.getElementById('kVisualStatus').textContent='Reset locally to V11 defaults. Press Save Visual Settings to store.'};base.getElementById('kSaveVisual').onclick=()=>saveVisual(base)}
function readUI(base){const v=defaults();Object.keys(FONT_DEFAULTS).forEach(k=>v.fontSizes[k]=num(base.getElementById('kv_'+k)?.value,FONT_DEFAULTS[k]));MOTION_KEYS.forEach(k=>v.motion[k]={effect:base.getElementById('km_'+k+'_effect')?.value||'default',duration:clamp(num(base.getElementById('km_'+k+'_duration')?.value,.7),.15,2.5),delay:clamp(num(base.getElementById('km_'+k+'_delay')?.value,0),0,3)});return v}
function writeUI(base,v){const x={...defaults(),...(v||{}),fontSizes:{...FONT_DEFAULTS,...(v?.fontSizes||{})},motion:{...defaults().motion,...(v?.motion||{})}};Object.keys(FONT_DEFAULTS).forEach(k=>{const el=base.getElementById('kv_'+k);if(el)el.value=num(x.fontSizes[k],FONT_DEFAULTS[k]);const out=base.getElementById('kv_'+k+'_v');if(out)out.textContent=num(x.fontSizes[k],FONT_DEFAULTS[k])+' px'});MOTION_KEYS.forEach(k=>{const m=x.motion[k]||{};const e=base.getElementById('km_'+k+'_effect'),du=base.getElementById('km_'+k+'_duration'),de=base.getElementById('km_'+k+'_delay');if(e)e.value=m.effect||'default';if(du)du.value=num(m.duration,.7);if(de)de.value=num(m.delay,0)})}
function scaleFont(el,size,def){if(!el)return;if(!el.dataset.kBaseFont)el.dataset.kBaseFont=parseFloat(getComputedStyle(el).fontSize)||20;el.style.fontSize=(Number(el.dataset.kBaseFont)*size/def)+'px'}function applyPreview(base,v){scaleFont(base.getElementById('pBadge'),v.fontSizes.badge,FONT_DEFAULTS.badge);scaleFont(base.getElementById('pEn'),v.fontSizes.en,FONT_DEFAULTS.en);scaleFont(base.getElementById('pAr'),v.fontSizes.ar,FONT_DEFAULTS.ar);scaleFont(base.getElementById('pOld'),v.fontSizes.old,FONT_DEFAULTS.old);scaleFont(base.getElementById('pPrice'),v.fontSizes.price,FONT_DEFAULTS.price);scaleFont(base.getElementById('pArFooter'),v.fontSizes.footerAr,FONT_DEFAULTS.footerAr);scaleFont(base.getElementById('pEnFooter'),v.fontSizes.footerEn,FONT_DEFAULTS.footerEn)}
function keyframes(effect){switch(effect){case'fade':return[{opacity:0},{opacity:1}];case'zoom-in':return[{opacity:0,transform:'scale(.72)'},{opacity:1,transform:'scale(1)'}];case'zoom-out':return[{opacity:0,transform:'scale(1.25)'},{opacity:1,transform:'scale(1)'}];case'left':return[{opacity:0,transform:'translateX(-90px)'},{opacity:1,transform:'translateX(0)'}];case'right':return[{opacity:0,transform:'translateX(90px)'},{opacity:1,transform:'translateX(0)'}];case'up':return[{opacity:0,transform:'translateY(65px)'},{opacity:1,transform:'translateY(0)'}];case'soft-pop':return[{opacity:0,transform:'scale(.82)'},{opacity:1,transform:'scale(1.04)',offset:.72},{opacity:1,transform:'scale(1)'}];case'cinematic':return[{opacity:0,transform:'translateX(70px) scale(.94)',filter:'blur(4px)'},{opacity:1,transform:'translateX(0) scale(1)',filter:'blur(0)'}];default:return[{opacity:.35},{opacity:1}]}}
function previewMotion(base,v){const map={badge:base.getElementById('pBadge'),title:base.querySelector('.titles'),price:base.getElementById('pPrice')?.parentElement,footer:base.querySelector('.footer'),image:base.getElementById('pImg')};MOTION_KEYS.forEach(k=>{const el=map[k],m=v.motion[k];if(!el)return;el.getAnimations?.().forEach(a=>a.cancel());el.animate(keyframes(m.effect),{duration:m.duration*1000,delay:m.delay*1000,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'})})}
async function visualFor(id){const [{data:d},{data:p}]=await Promise.all([db.from('screen_ads_draft').select('content').eq('id',id).maybeSingle(),db.from('screen_ads_public').select('content').eq('id',id).maybeSingle()]);return d?.content?.visual||p?.content?.visual||defaults()}
async function loadCurrent(base){if(loading)return;loading=true;try{const id=currentId(base),v=await visualFor(id);writeUI(base,v);applyPreview(base,{...defaults(),...v,fontSizes:{...FONT_DEFAULTS,...(v?.fontSizes||{})},motion:{...defaults().motion,...(v?.motion||{})}});const st=base.getElementById('kVisualStatus');if(st)st.textContent='Visual settings loaded for Ad '+id+'.'}catch(e){const st=base.getElementById('kVisualStatus');if(st)st.textContent='Could not load visual settings: '+(e.message||e)}finally{loading=false}}
async function saveVisual(base){const id=currentId(base),st=base.getElementById('kVisualStatus');try{st.textContent='Saving visual settings securely…';const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Admin session not found');const [{data:d,error:de},{data:p,error:pe}]=await Promise.all([db.from('screen_ads_draft').select('content').eq('id',id).maybeSingle(),db.from('screen_ads_public').select('content').eq('id',id).maybeSingle()]);if(de)throw de;if(pe)throw pe;let baseData={};const {baseWindow}=docs();try{baseData=baseWindow?.dataFor?.(id)||{}}catch(_){baseData={}}const existing=d?.content||p?.content||{};const content={...baseData,...existing,visual:readUI(base)};const {error}=await db.from('screen_ads_draft').upsert({id,content},{onConflict:'id'});if(error)throw error;st.textContent='Saved securely to Draft. Publish when approved.'}catch(e){st.textContent='Save failed: '+(e.message||e)}}
function inject(){try{const {control,base}=docs();if(!control||!base)return false;const right=control.querySelector('.bar .right');if(right){let b=control.getElementById('mp4ExportBtn');if(!b){b=control.createElement('button');b.id='mp4ExportBtn';b.className='btn';right.insertBefore(b,right.firstChild)}b.textContent='Production MP4 / تصدير نهائي';b.style.borderColor='#d8bb66';b.style.color='#f3d98d';b.onclick=()=>window.open('screen-export-production-v12.html?v=12','_blank','noopener');b.title='Production Exporter V12 · Typography + Motion';const pill=control.querySelector('.pill');if(pill)pill.textContent='V3.4'}ensureUI(base);const id=currentId(base);if(id!==lastId){lastId=id;setTimeout(()=>loadCurrent(base),80)}bound=true;return true}catch(e){return false}}
host.addEventListener('load',()=>{bound=false;lastId=null;setTimeout(inject,700)});setInterval(inject,500)})();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KWEIDER MP4 Export Studio — Safe V7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,sans-serif}
#host{display:block;width:100%;height:100%;border:0;background:#080808}
#state{position:fixed;left:16px;bottom:16px;z-index:10000;padding:8px 11px;border-radius:999px;border:1px solid #7a6129;background:rgba(10,10,9,.96);color:#ecd18b;font:700 11px/1.2 Arial,sans-serif;box-shadow:0 10px 35px rgba(0,0,0,.45)}
#state.ok{border-color:#3f613b;color:#bfe3b8}#state.bad{border-color:#6a4040;color:#efb0b0}
</style>
</head>
<body>
<iframe id="host" src="screen-export-studio-safe-v6.html?v=7" title="KWEIDER Safe MP4 Export V7"></iframe>
<div id="state">Preparing direct image source…</div>
<script>
(()=>{
'use strict';
const host=document.getElementById('host'),state=document.getElementById('state');
const REPO='kweider-sweets/advertisement';
const SNAPSHOT='c50cbec1c601d538fcc4fc8aca22e2996771a715';
const RAW_ROOT=`https://raw.githubusercontent.com/${REPO}/${SNAPSHOT}/`;
function deepest(){
  try{
    const v6=host.contentDocument;if(!v6)return null;
    const v5Frame=v6.getElementById('host');if(!v5Frame)return null;
    const v5=v5Frame.contentDocument;if(!v5)return null;
    const v4Frame=v5.getElementById('host');if(!v4Frame)return null;
    const v4=v4Frame.contentDocument;if(!v4)return null;
    const baseFrame=v4.getElementById('studio');if(!baseFrame)return null;
    const w=baseFrame.contentWindow,d=baseFrame.contentDocument;if(!w||!d)return null;
    return {w,d,v6,v5,v4};
  }catch(_){return null}
}
function cleanKey(s){return String(s||'').split('#')[0].split('?')[0]}
function baseName(s){const c=cleanKey(s);return c.substring(c.lastIndexOf('/')+1).toLowerCase()}
async function getAssets(w,d){
  const bf=d.getElementById('baselineFrame');if(!bf)throw new Error('Baseline source unavailable.');
  if(bf.contentDocument?.readyState!=='complete')await new Promise(r=>{let done=false;const f=()=>{if(done)return;done=true;r()};bf.addEventListener('load',f,{once:true});setTimeout(f,3500)});
  return bf.contentWindow.eval('ORIGINAL.map(x=>x.img).filter(Boolean)');
}
async function loadOneIntoBase(w,asset){
  const url=RAW_ROOT+String(asset).split('/').map(encodeURIComponent).join('/');
  const response=await fetch(url,{cache:'force-cache',mode:'cors'});
  if(!response.ok)throw new Error(`${asset}: HTTP ${response.status}`);
  const blob=await response.blob();
  if(!blob.size)throw new Error(`${asset}: empty image`);
  const objectUrl=w.URL.createObjectURL(blob);
  const img=new w.Image();img.decoding='async';
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error(`${asset}: decode failed`));img.src=objectUrl});
  if(!(img.naturalWidth>0&&img.naturalHeight>0))throw new Error(`${asset}: zero dimensions`);
  return {img,objectUrl};
}
async function buildDirectRegistry(w,d){
  if(w.__KWEIDER_DIRECT_IMAGE_REGISTRY_V7__)return w.__KWEIDER_DIRECT_IMAGE_REGISTRY_V7__;
  const assets=[...new Set(await getAssets(w,d))];
  const byName=new w.Map(),byExact=new w.Map();const failed=[];let loaded=0;
  for(const asset of assets){
    try{
      const item=await loadOneIntoBase(w,asset);
      byName.set(baseName(asset),item.img);
      byExact.set(asset,item.img);
      byExact.set(new w.URL(asset,w.location.href).href,item.img);
      loaded++;
    }catch(e){failed.push({asset,error:e.message||String(e)})}
  }
  const reg={loaded,total:assets.length,failed,byName,byExact};w.__KWEIDER_DIRECT_IMAGE_REGISTRY_V7__=reg;return reg;
}
function patchMap(w,reg){
  const P=w.Map?.prototype;if(!P)throw new Error('Map unavailable.');
  if(P.__kweiderDirectImagesV7)return;
  const previousGet=P.get;
  P.get=function(key){
    const current=previousGet.call(this,key);
    if(current!==null&&current!==undefined)return current;
    if(typeof key!=='string')return current;
    return previousGet.call(reg.byExact,key)||previousGet.call(reg.byExact,cleanKey(key))||previousGet.call(reg.byName,baseName(key))||current;
  };
  Object.defineProperty(P,'__kweiderDirectImagesV7',{value:true,configurable:false});
}
function setExport(d,enabled,message){
  const btn=d.getElementById('exportBtn');if(!btn)return;
  btn.disabled=!enabled;btn.title=message||'';
}
function updateUI(d,reg){
  const top=d.querySelector('.top');
  if(top&&!d.getElementById('directImgPill')){const p=d.createElement('div');p.id='directImgPill';p.style.cssText='border:1px solid #536b48;color:#c7e6bf;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;margin-left:8px';top.appendChild(p)}
  const p=d.getElementById('directImgPill');if(p)p.textContent=`DIRECT IMAGES ${reg.loaded}/${reg.total}`;
  const n=d.getElementById('notice');
  if(reg.failed.length){
    const names=reg.failed.map(x=>x.asset).join(', ');
    if(n){n.textContent=`Direct image verification failed for ${reg.failed.length} file(s): ${names}. Export remains blocked.`;n.className='notice bad'}
    setExport(d,false,'Direct image verification failed: '+names);
  }else{
    if(n){n.textContent=`Safe V7 ready. ${reg.loaded}/${reg.total} baseline images loaded directly from the pinned GitHub snapshot into local blob memory. Image + title synchronization and safe MP4 writer remain active.`;n.className='notice'}
    setExport(d,true,'All direct image sources verified');
  }
}
async function apply(){
  const x=deepest();if(!x)return false;
  try{
    state.textContent='Safe V7 · Loading images directly from GitHub…';state.className='';
    const reg=await buildDirectRegistry(x.w,x.d);patchMap(x.w,reg);updateUI(x.d,reg);
    const refresh=x.d.getElementById('loadBtn');if(refresh)refresh.click();
    if(reg.failed.length){state.textContent=`Safe V7 · Export blocked · ${reg.failed.length} direct image error(s)`;state.className='bad'}
    else{state.textContent=`Safe MP4 V7 · Direct images ${reg.loaded}/${reg.total} verified`;state.className='ok'}
    x.w.__KWEIDER_SAFE_V7__=true;return true;
  }catch(e){state.textContent='Safe V7 error: '+(e.message||e);state.className='bad';return false}
}
host.addEventListener('load',()=>setTimeout(()=>apply(),1700));
setInterval(()=>{const x=deepest();if(x&&!x.w.__KWEIDER_SAFE_V7__)apply()},1100);
})();
</script>
</body>
</html>

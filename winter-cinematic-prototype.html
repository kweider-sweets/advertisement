<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KWEIDER — Winter Cinematic Motion Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="screen" src="index.html" title="KWEIDER winter cinematic motion prototype"></iframe>
<script>
(function(){
  const frame=document.getElementById('screen');
  let loopTimer=null;

  frame.addEventListener('load',()=>{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d)return;

    const style=d.createElement('style');
    style.id='winter-cinematic-prototype-style';
    style.textContent=`
      /* Prototype only: preserve layout, copy, prices, imagery and base backgrounds. */
      .display-stage{isolation:isolate}

      .image-safe-frame{
        transform-origin:50% 52%;
        animation:winterCameraMove 7s cubic-bezier(.18,.72,.22,1) both !important;
        will-change:transform;
      }

      .new-price{
        animation-name:var(--price-name),winterPricePulse !important;
        animation-duration:.92s,1.45s !important;
        animation-delay:var(--price-delay),3.55s !important;
        animation-timing-function:cubic-bezier(.16,1,.3,1),cubic-bezier(.2,.8,.2,1) !important;
        animation-fill-mode:forwards,both !important;
      }

      .new-price::after{
        width:30% !important;
        background:linear-gradient(90deg,transparent,rgba(255,250,224,.9),rgba(243,217,141,.45),transparent) !important;
        filter:blur(3px) !important;
      }

      #winter-motion-layer{
        position:absolute;
        inset:0;
        z-index:9050;
        pointer-events:none;
        overflow:hidden;
        mix-blend-mode:screen;
      }

      #winter-opening-flare{
        position:absolute;
        inset:-22%;
        opacity:0;
        background:linear-gradient(116deg,transparent 32%,rgba(197,160,89,.06) 42%,rgba(243,217,141,.36) 48%,rgba(255,250,226,.72) 50%,rgba(243,217,141,.22) 53%,transparent 62%);
        filter:blur(9px);
        transform:translateX(-68%) skewX(-12deg) scale(1.28);
        animation:winterOpeningFlare 1.55s .18s cubic-bezier(.18,.72,.22,1) both;
      }

      #winter-gold-sweep{
        position:absolute;
        top:-28%;
        left:-42%;
        width:24%;
        height:158%;
        opacity:0;
        transform:rotate(14deg);
        background:linear-gradient(90deg,transparent,rgba(197,160,89,.035),rgba(243,217,141,.24),rgba(255,251,232,.40),rgba(243,217,141,.16),transparent);
        filter:blur(8px);
        animation:winterGoldSweep 6.4s 2.1s cubic-bezier(.2,.7,.2,1) infinite;
      }

      #winter-right-halo{
        position:absolute;
        left:51%;
        top:8%;
        width:46%;
        height:84%;
        opacity:.28;
        background:radial-gradient(ellipse at 50% 52%,rgba(243,217,141,.11) 0%,rgba(197,160,89,.035) 31%,transparent 68%);
        filter:blur(16px);
        animation:winterHaloBreath 5.8s 1.1s ease-in-out infinite alternate;
      }

      #winter-particles{position:absolute;inset:0;opacity:.34}
      #winter-particles i{
        position:absolute;
        display:block;
        width:clamp(2px,.18vmin,6px);
        aspect-ratio:1;
        border-radius:50%;
        background:rgba(243,217,141,.82);
        box-shadow:0 0 10px rgba(243,217,141,.35);
        opacity:0;
        animation:winterParticle 6.8s linear infinite;
      }
      #winter-particles i:nth-child(1){left:7%;top:91%;animation-delay:.1s;animation-duration:7.4s}
      #winter-particles i:nth-child(2){left:15%;top:74%;animation-delay:1.8s;animation-duration:6.7s}
      #winter-particles i:nth-child(3){left:27%;top:87%;animation-delay:3.1s;animation-duration:8.1s}
      #winter-particles i:nth-child(4){left:39%;top:69%;animation-delay:.8s;animation-duration:7.8s}
      #winter-particles i:nth-child(5){left:47%;top:93%;animation-delay:2.6s;animation-duration:6.9s}
      #winter-particles i:nth-child(6){left:57%;top:82%;animation-delay:4.2s;animation-duration:8.4s}
      #winter-particles i:nth-child(7){left:64%;top:95%;animation-delay:1.2s;animation-duration:7.1s}
      #winter-particles i:nth-child(8){left:71%;top:73%;animation-delay:3.7s;animation-duration:7.9s}
      #winter-particles i:nth-child(9){left:79%;top:89%;animation-delay:.5s;animation-duration:8.6s}
      #winter-particles i:nth-child(10){left:87%;top:78%;animation-delay:2.2s;animation-duration:7.3s}
      #winter-particles i:nth-child(11){left:93%;top:92%;animation-delay:4.8s;animation-duration:8.0s}
      #winter-particles i:nth-child(12){left:33%;top:98%;animation-delay:5.4s;animation-duration:8.7s}

      @keyframes winterCameraMove{
        0%{transform:translate3d(0,1.2%,0) scale(.992)}
        24%{transform:translate3d(-.35%,-.15%,0) scale(1.018)}
        67%{transform:translate3d(.55%,-.55%,0) scale(1.038)}
        100%{transform:translate3d(.15%,-.85%,0) scale(1.052)}
      }
      @keyframes winterPricePulse{
        0%{transform:scale(1);filter:brightness(1)}
        34%{transform:scale(1.045);filter:brightness(1.24);text-shadow:0 0 34px rgba(243,217,141,.36),0 0 85px rgba(197,160,89,.16)}
        67%{transform:scale(1.015);filter:brightness(1.1)}
        100%{transform:scale(1);filter:brightness(1)}
      }
      @keyframes winterOpeningFlare{
        0%{opacity:0;transform:translateX(-68%) skewX(-12deg) scale(1.28)}
        22%{opacity:.78}
        55%{opacity:.52}
        100%{opacity:0;transform:translateX(68%) skewX(-12deg) scale(1.28)}
      }
      @keyframes winterGoldSweep{
        0%,56%{left:-42%;opacity:0}
        62%{opacity:.52}
        78%{opacity:.34}
        91%,100%{left:126%;opacity:0}
      }
      @keyframes winterHaloBreath{
        0%{opacity:.16;transform:scale(.96)}
        100%{opacity:.34;transform:scale(1.045)}
      }
      @keyframes winterParticle{
        0%{opacity:0;transform:translate3d(0,0,0) scale(.65)}
        16%{opacity:.38}
        52%{opacity:.22}
        100%{opacity:0;transform:translate3d(18px,-230px,0) scale(1.12)}
      }
    `;
    d.head.appendChild(style);

    const stage=d.querySelector('.display-stage');
    if(stage&&!d.getElementById('winter-motion-layer')){
      const layer=d.createElement('div');
      layer.id='winter-motion-layer';
      layer.innerHTML=`<div id="winter-opening-flare"></div><div id="winter-gold-sweep"></div><div id="winter-right-halo"></div><div id="winter-particles">${'<i></i>'.repeat(12)}</div>`;
      stage.appendChild(layer);
    }

    // Keep the prototype on the Kunafa ad (ID 2) and replay it continuously.
    try{w.scheduleNext=()=>{};}catch(e){}

    setTimeout(()=>{
      try{w.showNextAd();}catch(e){}
    },180);

    clearInterval(loopTimer);
    loopTimer=setInterval(()=>{
      try{
        if(!w.document.hidden){
          const oldLayer=d.getElementById('winter-motion-layer');
          if(oldLayer){
            oldLayer.querySelector('#winter-opening-flare').style.animation='none';
            void oldLayer.offsetWidth;
            oldLayer.querySelector('#winter-opening-flare').style.animation='winterOpeningFlare 1.55s .18s cubic-bezier(.18,.72,.22,1) both';
          }
          w.restartCurrentAd();
        }
      }catch(e){}
    },7200);
  });
})();
</script>
</body>
</html>

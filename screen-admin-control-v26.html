<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KWEIDER Screen Control V2.6</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}#host{display:block;width:100%;height:100%;border:0;background:#080808}</style>
</head>
<body>
<iframe id="host" src="screen-admin-control-v22.html?v=26" title="KWEIDER Screen Control V2.6"></iframe>
<script>
(()=>{
const host=document.getElementById('host');let bound=false;
function inject(){
  try{
    const v22=host.contentDocument;if(!v22)return false;
    const v21=v22.getElementById('host')?.contentDocument;if(!v21)return false;
    const control=v21.getElementById('host')?.contentDocument;if(!control)return false;
    const right=control.querySelector('.bar .right');if(!right)return false;
    let b=control.getElementById('mp4ExportBtn');
    if(!b){b=control.createElement('button');b.id='mp4ExportBtn';b.className='btn';b.textContent='Export MP4 / تصدير فيديو';b.style.borderColor='#d8bb66';b.style.color='#f3d98d';right.insertBefore(b,right.firstChild)}
    b.onclick=()=>window.open('screen-export-studio-safe-v4.html?v=4','_blank','noopener');b.title='Safe MP4 Export Studio V4';
    const pill=control.querySelector('.pill');if(pill)pill.textContent='V2.6';bound=true;return true;
  }catch(e){return false}
}
host.addEventListener('load',()=>{bound=false;setTimeout(inject,500)});setInterval(()=>{if(!bound)inject()},500);
})();
</script>
</body>
</html>

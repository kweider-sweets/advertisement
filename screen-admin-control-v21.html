<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://hbloyloryxksbsornjlg.supabase.co wss://hbloyloryxksbsornjlg.supabase.co; frame-src 'self'; object-src 'none'; base-uri 'self'">
<title>KWEIDER Screen Control V2.1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,sans-serif;color:#fff}#host{width:100%;height:100%;border:0;background:#080808}.verify{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;display:none;max-width:min(720px,92vw);padding:10px 14px;border-radius:10px;border:1px solid #4a402d;background:#11100d;color:#ead9a7;font-size:12px;box-shadow:0 16px 45px rgba(0,0,0,.55)}.verify.show{display:block}.verify.ok{border-color:#3f613b;color:#bfe3b8}.verify.bad{border-color:#6a4040;color:#efb0b0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<iframe id="host" src="screen-admin-control-v2.html?v=21" title="KWEIDER Screen Control V2.1"></iframe>
<div id="verify" class="verify"></div>
<script>
(()=>{
'use strict';
const URL='https://hbloyloryxksbsornjlg.supabase.co';
const KEY='sb_publishable_6oq2EgVDzMHkzxlRgwFdSw_MPU2DmaN';
const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const host=document.getElementById('host'),box=document.getElementById('verify');
let boundButton=null,timer=null;
function msg(text,type=''){clearTimeout(timer);box.textContent=text;box.className='verify show '+type;timer=setTimeout(()=>box.className='verify',3600)}
function baseDoc(){try{const c=host.contentDocument;if(!c)return null;const s=c.getElementById('frame')?.contentDocument;if(!s)return null;const a=s.getElementById('appFrame')?.contentDocument;if(!a)return null;const l=a.getElementById('manager')?.contentDocument;if(!l)return null;return l.getElementById('adminFrame')?.contentDocument||null}catch(e){return null}}
function currentId(d){const b=d?.querySelector('.ad-btn.active'),m=b?.textContent.match(/Ad\s+(\d+)/i);return m?Number(m[1]):1}
async function ensureAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Admin session not found. Sign in again.');const {data,error}=await db.from('screen_admins').select('role').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data||data.role!=='admin')throw new Error('Account is not authorised.');}
async function verifyOps(){
  const d=baseDoc();if(!d)return;
  const id=currentId(d),active=d.getElementById('kActive')?.checked??true,displayOrder=Math.max(1,Number(d.getElementById('kOrder')?.value||id)),durationSec=Math.min(30,Math.max(4,Number(d.getElementById('kDuration')?.value||7)));
  try{
    await ensureAdmin();
    await new Promise(r=>setTimeout(r,650));
    const {data:row,error}=await db.from('screen_ads_draft').select('id,content,version').eq('id',id).maybeSingle();if(error)throw error;
    const current=row?.content||{};
    const ok=current.active===active && Number(current.displayOrder)===displayOrder && Number(current.durationSec)===durationSec;
    if(ok){msg(`Verified: Ad ${id} saved · ${active?'Active':'Inactive'} · Order #${displayOrder} · ${durationSec}s`,'ok');return;}
    const content={...current,active,displayOrder,durationSec};
    const {data:saved,error:saveErr}=await db.from('screen_ads_draft').upsert({id,content},{onConflict:'id'}).select('version').single();if(saveErr)throw saveErr;
    msg(`Verified & repaired: Ad ${id} · Draft v${saved.version} · ${active?'Active':'Inactive'} · Order #${displayOrder} · ${durationSec}s`,'ok');
    try{const status=d.getElementById('status');if(status)status.textContent=`Secure draft verified · version ${saved.version}. Live display unchanged.`}catch(e){}
  }catch(e){msg('Save verification failed: '+(e.message||e),'bad')}
}
function bind(){const d=baseDoc();if(!d)return;const btn=d.getElementById('saveDraft');if(!btn||btn===boundButton)return;boundButton=btn;btn.addEventListener('click',()=>setTimeout(verifyOps,50),true)}
host.addEventListener('load',()=>{boundButton=null;setTimeout(bind,500)});setInterval(bind,500);
})();
</script>
</body>
</html>

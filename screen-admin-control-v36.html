<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>KWEIDER Screen Control V3.6 — Live Editing</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}#host{display:block;width:100%;height:100%;border:0;background:#080808}</style>
</head>
<body>
<iframe id="host" src="screen-admin-control-v35.html?v=36" title="KWEIDER Screen Control V3.6"></iframe>
<script>
(()=>{'use strict';
const host=document.getElementById('host');
function tune(){
 try{
  const d=host.contentDocument;if(!d)return false;
  if(!d.getElementById('drawer')||!d.getElementById('visualFab'))return false;
  let s=d.getElementById('kLiveEditStyle');
  if(!s){
   s=d.createElement('style');s.id='kLiveEditStyle';s.textContent=`
    #drawer{right:auto!important;left:0!important;width:min(400px,88vw)!important;border-left:0!important;border-right:1px solid #4c3f28!important;box-shadow:20px 0 70px rgba(0,0,0,.62)!important;transform:translateX(-102%)!important}
    #drawer.open{transform:none!important}
    #drawerShade,#drawerShade.open{display:none!important;background:transparent!important;pointer-events:none!important}
    #visualFab{right:18px!important;left:auto!important;bottom:18px!important}
   `;d.head.appendChild(s);
  }
  d.title='KWEIDER Screen Control V3.6 — Live Editing';
  const tag=d.querySelector('#visualFab .vtag');if(tag)tag.textContent='V3.6';
  const sub=d.querySelector('#drawer .sub');if(sub)sub.textContent='Live editing · preview stays visible · secure Draft';
  return true;
 }catch(e){return false}
}
host.addEventListener('load',()=>setTimeout(tune,350));setInterval(tune,700);
})();
</script>
</body>
</html>

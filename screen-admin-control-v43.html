<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>KWEIDER Screen Control V4.3 — Premium Scene FX</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}#host{display:block;width:100%;height:100%;border:0;background:#080808}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<iframe id="host" src="screen-admin-control-v42.html?v=430" title="KWEIDER Screen Control V4.3"></iframe>
<script>
(()=>{'use strict';
const URL='https://hbloyloryxksbsornjlg.supabase.co',KEY='sb_publishable_6oq2EgVDzMHkzxlRgwFdSw_MPU2DmaN';
const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),host=document.getElementById('host');
const DEF={type:'editorial-push',intensity:42};let lastId=null,loading=false;
function allDocs(doc,out=[],depth=0){if(!doc||depth>32)return out;out.push(doc);try{for(const f of doc.querySelectorAll('iframe')){try{if(f.contentDocument)allDocs(f.contentDocument,out,depth+1)}catch(_){}}}catch(_){}return out}
function locate(){const docs=allDocs(host.contentDocument||document);let controls=null,base=null,cine=null,bar=null;for(const d of docs){if(!controls&&d.getElementById('drawer')&&d.getElementById('fontGrid'))controls=d;if(!base&&d.getElementById('adList')&&d.getElementById('saveDraft'))base=d;if(!cine&&d.getElementById('dynamic-ad-area')&&d.querySelector('.display-stage'))cine=d;if(!bar&&d.getElementById('historyBtn')&&d.querySelector?.('.bar .right'))bar=d}return{controls,base,cine,bar}}
function currentId(base){const b=base?.querySelector('.ad-btn.active'),m=b?.textContent.match(/Ad\s+(\d+)/i);return m?Number(m[1]):1}
function ensureCard(d){if(!d||d.getElementById('kSceneFxCard'))return;const st=d.createElement('style');st.id='kSceneFxStyle';st.textContent=`
#kSceneFxCard .ks-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:9px}.ks-field label{display:flex;justify-content:space-between;color:#cbbfa8;font-size:10px;margin-bottom:6px}.ks-field select,.ks-field input[type=range]{width:100%}.ks-field select{background:#080808;color:#fff;border:1px solid #352d22;border-radius:8px;padding:9px;font-size:10px}.ks-field input[type=range]{accent-color:#c5a059}.ks-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.ks-btn{border:1px solid #78652f;background:#15120e;color:#ead68e;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:900;cursor:pointer}.ks-btn.primary{background:linear-gradient(135deg,#7a5a11,#c9a53e);color:#080706}.ks-note{font-size:9px;color:#9d927f;line-height:1.5;margin-top:8px}.ks-status{font-size:10px;color:#a99d89;margin-top:8px;min-height:15px}.ks-status.ok{color:#9bd292}.ks-status.bad{color:#efa3a3}@media(max-width:560px){#kSceneFxCard .ks-grid{grid-template-columns:1fr}}
`;d.head.appendChild(st);
 const card=d.createElement('div');card.id='kSceneFxCard';card.className='card';card.innerHTML=`<div class="ct">Cinematic Scene FX / الحركة السينمائية</div><div class="ks-grid"><div class="ks-field"><label>Style</label><select id="ksType"><option value="editorial-push">1 — Editorial Push</option><option value="depth-drift">2 — Depth Drift</option><option value="gallery-spotlight">3 — Gallery Spotlight</option><option value="off">Off — بدون</option></select></div><div class="ks-field"><label>Intensity <b id="ksIntensityV">42%</b></label><input id="ksIntensity" type="range" min="15" max="75" step="1" value="42"></div></div><div class="ks-actions"><button type="button" class="ks-btn" id="ksPreview">Preview Scene FX</button><button type="button" class="ks-btn primary" id="ksSave">Save Scene FX</button></div><div class="ks-note">No flash or sweep. Editorial Push = slow camera push. Depth Drift = restrained parallax. Gallery Spotlight = broad moving light/shadow that remains visible on cream backgrounds.</div><div class="ks-status" id="ksStatus"></div>`;
 const imageCard=d.getElementById('kImageFxCard');if(imageCard)imageCard.insertAdjacentElement('afterend',card);else{const motionCard=d.getElementById('motionGrid')?.closest('.card');if(motionCard)motionCard.insertAdjacentElement('afterend',card);else d.getElementById('drawer')?.appendChild(card)}
 d.getElementById('ksType').onchange=()=>applyFx(d,true);d.getElementById('ksIntensity').oninput=()=>{d.getElementById('ksIntensityV').textContent=d.getElementById('ksIntensity').value+'%';applyFx(d,true)};d.getElementById('ksPreview').onclick=()=>applyFx(d,true);d.getElementById('ksSave').onclick=()=>saveFx(d);
}
function readFx(d){return{type:d.getElementById('ksType')?.value||DEF.type,intensity:Number(d.getElementById('ksIntensity')?.value||DEF.intensity)}}
function writeFx(d,x){x={...DEF,...(x||{})};d.getElementById('ksType').value=x.type||DEF.type;d.getElementById('ksIntensity').value=Math.max(15,Math.min(75,Number(x.intensity||DEF.intensity)));d.getElementById('ksIntensityV').textContent=d.getElementById('ksIntensity').value+'%'}
function status(d,t,c=''){const e=d.getElementById('ksStatus');if(e){e.textContent=t;e.className='ks-status'+(c?' '+c:'')}}
function clearFx(cine){if(!cine)return;cine.querySelectorAll('.k-scene-fx-overlay').forEach(x=>x.remove());const a=cine.querySelector('.ad-container');if(a){a.style.animation='';a.style.transform=''}cine.querySelectorAll('.left-screen,.right-screen').forEach(x=>{x.style.animation='';x.style.transform='';x.style.transformOrigin=''})}
function applyFx(d,restart=false){const {cine}=locate();if(!cine)return status(d,'Open Cinematic Preview to see this effect.');const fx=readFx(d),k=fx.intensity/100;clearFx(cine);if(fx.type==='off')return status(d,'Scene FX off.','ok');let s=cine.getElementById('kPremiumSceneFxCss');if(!s){s=cine.createElement('style');s.id='kPremiumSceneFxCss';s.textContent=`@keyframes kEditorialPush{0%{transform:scale(1) translate3d(0,.18%,0)}100%{transform:scale(1.014) translate3d(.12%,-.16%,0)}}@keyframes kDepthLeft{0%{transform:scale(1.01) translate3d(.25%,.08%,0)}100%{transform:scale(1.01) translate3d(-.35%,-.10%,0)}}@keyframes kDepthRight{0%{transform:scale(1.01) translate3d(-.28%,-.05%,0)}100%{transform:scale(1.01) translate3d(.42%,.10%,0)}}@keyframes kGallerySpot{0%{transform:translateX(-38%) rotate(-7deg);opacity:.35}45%{opacity:.72}100%{transform:translateX(42%) rotate(-7deg);opacity:.42}}`;cine.head.appendChild(s)}
 const ad=cine.querySelector('.ad-container');if(fx.type==='editorial-push'&&ad){ad.style.transformOrigin='50% 50%';ad.style.animation=`kEditorialPush ${7.8-2*k}s cubic-bezier(.22,.61,.36,1) both`}
 if(fx.type==='depth-drift'){const l=cine.querySelector('.left-screen'),r=cine.querySelector('.right-screen');if(l){l.style.transformOrigin='50% 50%';l.style.animation=`kDepthLeft ${7.4-1.5*k}s cubic-bezier(.22,.61,.36,1) both`}if(r){r.style.transformOrigin='50% 50%';r.style.animation=`kDepthRight ${7.4-1.5*k}s cubic-bezier(.22,.61,.36,1) both`}}
 if(fx.type==='gallery-spotlight'&&ad){const o=cine.createElement('div');o.className='k-scene-fx-overlay';Object.assign(o.style,{position:'absolute',inset:'-12% -28%',zIndex:'4',pointerEvents:'none',mixBlendMode:'soft-light',background:`linear-gradient(100deg,rgba(55,38,18,0) 26%,rgba(62,43,20,${.10+.12*k}) 42%,rgba(255,246,221,${.08+.09*k}) 50%,rgba(62,43,20,${.08+.10*k}) 58%,rgba(55,38,18,0) 74%)`,filter:'blur(34px)',animation:`kGallerySpot ${6.8-1.2*k}s cubic-bezier(.22,.61,.36,1) both`});ad.appendChild(o)}
 status(d,'Previewing '+fx.type.replaceAll('-',' ')+'.','ok')}
async function loadFx(id,d){if(loading)return;loading=true;try{const [{data:dr,error:de},{data:pu,error:pe}]=await Promise.all([db.from('screen_ads_draft').select('content').eq('id',id).maybeSingle(),db.from('screen_ads_public').select('content').eq('id',id).maybeSingle()]);if(de)throw de;if(pe)throw pe;writeFx(d,dr?.content?.visual?.sceneFx||pu?.content?.visual?.sceneFx||DEF);status(d,`Loaded scene FX for Ad ${id}.`,'ok')}catch(e){writeFx(d,DEF);status(d,'Load failed: '+(e.message||e),'bad')}finally{loading=false}}
async function saveFx(d){const {base}=locate();if(!base)return status(d,'Active advertisement not found.','bad');const id=currentId(base);try{status(d,'Saving scene FX…');const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Admin session not found');const [{data:dr,error:de},{data:pu,error:pe}]=await Promise.all([db.from('screen_ads_draft').select('content').eq('id',id).maybeSingle(),db.from('screen_ads_public').select('content').eq('id',id).maybeSingle()]);if(de)throw de;if(pe)throw pe;let current={};try{current=typeof base.defaultView?.dataFor==='function'?base.defaultView.dataFor(id)||{}:{}}catch(_){}const existing=dr?.content||pu?.content||{},visual={...(existing.visual||{}),sceneFx:readFx(d)},content={...current,...existing,visual};const {error}=await db.from('screen_ads_draft').upsert({id,content},{onConflict:'id'});if(error)throw error;status(d,`Ad ${id}: scene FX saved to Draft.`,'ok')}catch(e){status(d,'Save failed: '+(e.message||e),'bad')}}
function tune(){try{const {controls:d,base,bar}=locate();if(!d||!base)return false;ensureCard(d);const id=currentId(base);if(id!==lastId){lastId=id;loadFx(id,d)}const exp=d.getElementById('exportBtn');if(exp){exp.textContent='Open V16 Exporter';exp.onclick=()=>window.open('screen-export-production-v16.html?v=16','_blank','noopener')}for(const doc of allDocs(host.contentDocument||document)){const old=doc.getElementById('mp4ExportBtn');if(old){old.textContent='Production MP4 V16 / تصدير نهائي';old.onclick=()=>window.open('screen-export-production-v16.html?v=16','_blank','noopener');old.title='V16 · Premium Scene FX · no flash'}}if(bar){const p=bar.querySelector('.pill');if(p)p.textContent='V4.3';bar.title='KWEIDER Screen Control V4.3'}return true}catch(_){return false}}
host.addEventListener('load',()=>setTimeout(tune,1200));setInterval(tune,650);
})();
</script>
</body>
</html>

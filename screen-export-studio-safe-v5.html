<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KWEIDER MP4 Export Studio — Safe V5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,sans-serif}
#host{display:block;width:100%;height:100%;border:0;background:#080808}
#state{position:fixed;left:16px;bottom:16px;z-index:9999;padding:8px 11px;border-radius:999px;border:1px solid #3f613b;background:rgba(10,10,9,.95);color:#bfe3b8;font:700 11px/1.2 Arial,sans-serif;box-shadow:0 10px 35px rgba(0,0,0,.45)}
#state.warn{border-color:#7a6129;color:#ecd18b}#state.bad{border-color:#6a4040;color:#efb0b0}
</style>
</head>
<body>
<iframe id="host" src="screen-export-studio-safe-v4.html?v=5" title="KWEIDER Safe MP4 Export V5"></iframe>
<div id="state">Preparing synchronized image/title reveal…</div>
<script>
(()=>{
'use strict';
const host=document.getElementById('host'),state=document.getElementById('state');
function deepest(){
  try{
    const v4=host.contentDocument;if(!v4)return null;
    const baseFrame=v4.getElementById('studio');if(!baseFrame)return null;
    const w=baseFrame.contentWindow,d=baseFrame.contentDocument;if(!w||!d)return null;
    return {w,d,v4};
  }catch(e){return null}
}
function patchReveal(w,d){
  const P=w.CanvasRenderingContext2D?.prototype;if(!P)throw new Error('Canvas renderer unavailable.');
  if(P.__kweiderSyncRevealV5)return;
  const original=P.drawImage;
  P.drawImage=function(source,...args){
    let product=false;
    try{
      product=(w.ImageBitmap&&source instanceof w.ImageBitmap)||(w.HTMLImageElement&&source instanceof w.HTMLImageElement);
    }catch(_){product=false}
    if(!product)return original.call(this,source,...args);
    const old=this.globalAlpha;
    // Base exporter reveals product image from t=0 over 0.9s.
    // Main title starts at t=0.20s. Gate/remap the product alpha so its first visible frame
    // is the same moment as the main title, while preserving a smooth cinematic fade.
    const titleStartThreshold=0.5294924554; // easeOut(0.20 / 0.90)
    let synced=old;
    if(old<=titleStartThreshold)synced=0;
    else if(old<0.999999){
      let u=(old-titleStartThreshold)/(1-titleStartThreshold);
      u=Math.max(0,Math.min(1,u));
      synced=u*u*(3-2*u);
    }
    this.globalAlpha=synced;
    try{return original.call(this,source,...args)}finally{this.globalAlpha=old}
  };
  Object.defineProperty(P,'__kweiderSyncRevealV5',{value:true,configurable:false});
  w.__KWEIDER_SYNC_REVEAL_V5__=true;
  try{
    const top=d.querySelector('.top');
    if(top&&!d.getElementById('syncPill')){
      const pill=d.createElement('div');pill.id='syncPill';pill.textContent='IMAGE + TITLE SYNC';pill.style.cssText='border:1px solid #536b48;color:#c7e6bf;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;margin-left:8px';top.appendChild(pill);
    }
    const previewNotice=d.querySelector('.preview + .notice')||d.querySelector('.panel:nth-child(2) .notice');
    if(previewNotice)previewNotice.textContent='V5 cinematic rule: product image and main title begin together. Badge may lead briefly; image/title then reveal in sync. Image Safety V4 and H.264 HW/SW fallback remain active.';
  }catch(_){ }
}
function apply(){
  const x=deepest();if(!x)return false;
  try{
    patchReveal(x.w,x.d);
    state.textContent='Safe MP4 V5 · Image + Title synchronized';state.className='';
    return true;
  }catch(e){state.textContent='V5 sync error: '+(e.message||e);state.className='bad';return false}
}
host.addEventListener('load',()=>setTimeout(apply,900));
setInterval(()=>{const x=deepest();if(x&&!x.w.__KWEIDER_SYNC_REVEAL_V5__)apply()},700);
})();
</script>
</body>
</html>

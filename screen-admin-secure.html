<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://hbloyloryxksbsornjlg.supabase.co wss://hbloyloryxksbsornjlg.supabase.co; img-src 'self' data: blob: https://hbloyloryxksbsornjlg.supabase.co; frame-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>KWEIDER Screen Control — Secure Admin</title>
<style>
:root{--gold:#c5a059;--gold2:#f3d98d;--bg:#080808;--panel:#111;--line:#332b20;--muted:#a99d89;--ok:#8fca88;--warn:#e5ba67;--bad:#e09191}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif;color:#fff}
.hidden{display:none!important}
#loginView{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#1b140b 0,#090909 40%,#050505 100%);padding:20px}
.login-card{width:min(440px,100%);background:#0d0d0d;border:1px solid #493c27;border-radius:18px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.brand{font-weight:900;letter-spacing:.19em;color:var(--gold2);font-size:20px}.kicker{margin:7px 0 22px;color:var(--muted);font-size:12px}.field{margin-bottom:13px}.field label{display:block;color:#d1c4ab;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid #403522;border-radius:10px;background:#080808;color:#fff;font:inherit;outline:none}.field input:focus{border-color:var(--gold)}
.login-btn,.bar-btn{border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.login-btn{width:100%;margin-top:7px;background:linear-gradient(135deg,#8c6510,#d2af45);color:#080808}.login-btn:disabled{opacity:.55;cursor:wait}.login-status{min-height:18px;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.4}.login-status.bad{color:var(--bad)}
#secureApp{height:100%;display:grid;grid-template-rows:52px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0b0b;z-index:30}.top-left,.top-right{display:flex;align-items:center;gap:10px;min-width:0}.secure-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #3d5138;border-radius:999px;padding:5px 9px;color:#bfe2b8;font-size:11px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(143,202,136,.55)}.admin-email{font-size:12px;color:#c7b99e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px}.cloud-state{font-size:11px;color:var(--muted);white-space:nowrap}.bar-btn{padding:7px 10px;background:#12100d;color:#e7d49d;font-size:11px}.bar-btn.danger{border-color:#633d3d;color:#e9acac}.bar-btn:hover{filter:brightness(1.12)}
#appFrame{display:block;width:100%;height:100%;border:0;background:#080808}
.toast{position:fixed;right:18px;top:66px;z-index:900;max-width:420px;border:1px solid #504329;border-radius:11px;padding:11px 13px;background:#11100d;color:#e9dbb6;font-size:12px;box-shadow:0 18px 55px rgba(0,0,0,.55);opacity:0;transform:translateY(-7px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.toast.ok{border-color:#385237;color:#c5e4be}.toast.bad{border-color:#673f3f;color:#efb0b0}
@media(max-width:700px){#secureApp{grid-template-rows:auto 1fr}.topbar{padding:8px 10px;align-items:flex-start}.top-left{flex-direction:column;align-items:flex-start;gap:4px}.cloud-state{display:none}.admin-email{max-width:180px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="brand">KWEIDER</div>
    <div class="kicker">Secure Street Display Control / لوحة إدارة الشاشات الآمنة</div>
    <form id="loginForm">
      <div class="field"><label>Admin email</label><input id="email" type="email" autocomplete="username" value="isweets.kw@gmail.com" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="login-btn" id="loginBtn" type="submit">Sign in / دخول</button>
    </form>
    <div class="login-status" id="loginStatus">Only authorised KWEIDER screen administrators can enter.</div>
  </div>
</div>

<div id="secureApp" class="hidden">
  <div class="topbar">
    <div class="top-left">
      <span class="secure-pill"><span class="dot"></span>SECURE ADMIN</span>
      <span class="admin-email" id="adminEmail"></span>
      <span class="cloud-state" id="cloudState">Connecting to secure storage…</span>
    </div>
    <div class="top-right">
      <button class="bar-btn" id="refreshCloud">Refresh cloud</button>
      <button class="bar-btn danger" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <iframe id="appFrame" title="KWEIDER secure screen admin"></iframe>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const SUPABASE_URL='https://hbloyloryxksbsornjlg.supabase.co';
const SUPABASE_KEY='sb_publishable_6oq2EgVDzMHkzxlRgwFdSw_MPU2DmaN';
const DRAFT_KEY='kweider-screen-admin-drafts-v1';
const BG_GLOBAL_KEY='kweider-screen-background-global-v1';
const BG_OVERRIDE_KEY='kweider-screen-background-overrides-v1';
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let cloudDrafts={};
let user=null;
let bound=false;
let toastTimer=null;

function notify(msg,type=''){
  const t=$('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3200);
}
function setLoginStatus(msg,bad=false){$('loginStatus').textContent=msg;$('loginStatus').className='login-status'+(bad?' bad':'')}
function setCloudState(msg){$('cloudState').textContent=msg}
function safeJSON(v,fallback){try{return JSON.parse(v)||fallback}catch(e){return fallback}}
function extFromName(name){const m=(name||'').toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1].replace('jpeg','jpg'):'webp'}
function fileNameFromSrc(src){try{const u=new URL(src,location.href);const n=u.pathname.split('/').pop();return n&&/\.(webp|png|jpe?g)$/i.test(n)?n:null}catch(e){return null}}
function currentId(doc){const b=doc&&doc.querySelector('.ad-btn.active'),m=b&&b.textContent.match(/Ad\s+(\d+)/i);return m?Number(m[1]):1}

function nested(){
  try{
    const linked=$('appFrame').contentDocument;
    const cinematicFrame=linked&&linked.getElementById('manager');
    const cinematic=cinematicFrame&&cinematicFrame.contentDocument;
    const baseFrame=cinematic&&cinematic.getElementById('adminFrame');
    const base=baseFrame&&baseFrame.contentDocument;
    return {linked,cinematic,base,baseWindow:baseFrame&&baseFrame.contentWindow};
  }catch(e){return {linked:null,cinematic:null,base:null,baseWindow:null}}
}

async function signedDraftImage(path){
  if(!path)return null;
  const {data,error}=await db.storage.from('screen-drafts').createSignedUrl(path,3600);
  if(error)return null;
  return data.signedUrl;
}

async function loadCloudDrafts(){
  setCloudState('Loading secure drafts…');
  const {data,error}=await db.from('screen_ads_draft').select('id,content,version,updated_at').order('id');
  if(error)throw error;
  cloudDrafts={};
  const local=safeJSON(localStorage.getItem(DRAFT_KEY),'{}');
  const merged=(local&&typeof local==='object')?local:{};
  for(const row of (data||[])){
    const c=row.content||{};
    const signed=c.imagePath?await signedDraftImage(c.imagePath):null;
    const draft={
      en:c.en||'',ar:c.ar||'',price:c.price||'',oldPrice:c.oldPrice||'',save:c.save||'',
      labelEn:c.labelEn||'',labelAr:c.labelAr||'',zoom:Number(c.zoom??1),x:Number(c.x??0),y:Number(c.y??0),
      imageMeta:c.imageMeta||null,previewImage:signed||c.previewImage||null
    };
    cloudDrafts[row.id]={...row,content:c,signedImage:signed};
    merged[row.id]=draft;
    if(c.bgGlobal)localStorage.setItem(BG_GLOBAL_KEY,JSON.stringify(c.bgGlobal));
    if(c.bgOverrides)localStorage.setItem(BG_OVERRIDE_KEY,JSON.stringify(c.bgOverrides));
  }
  localStorage.setItem(DRAFT_KEY,JSON.stringify(merged));
  setCloudState(`${(data||[]).length} secure draft${(data||[]).length===1?'':'s'} loaded`);
  return data||[];
}

async function authorize(u){
  const {data,error}=await db.from('screen_admins').select('role').eq('user_id',u.id).maybeSingle();
  if(error)throw error;
  if(!data||data.role!=='admin')throw new Error('This account is not authorised for KWEIDER Screen Control.');
  user=u;
  $('adminEmail').textContent=u.email||'Admin';
  await loadCloudDrafts();
  $('loginView').classList.add('hidden');
  $('secureApp').classList.remove('hidden');
  bound=false;
  $('appFrame').src='screen-admin-linked-bg.html';
}

async function signIn(email,password){
  $('loginBtn').disabled=true;setLoginStatus('Signing in securely…');
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    await authorize(data.user);
    setLoginStatus('Signed in.');
  }catch(e){
    await db.auth.signOut().catch(()=>{});
    setLoginStatus(e.message||'Unable to sign in.',true);
  }finally{$('loginBtn').disabled=false}
}

function gatherContent(base,id){
  const val=n=>base.getElementById(n)?.value||'';
  const existing=cloudDrafts[id]?.content||{};
  const img=base.getElementById('pImg');
  const meta=img?.dataset.tempMeta?safeJSON(img.dataset.tempMeta,null):(existing.imageMeta||null);
  return {
    en:val('titleEn'),ar:val('titleAr'),price:val('price'),oldPrice:val('oldPrice'),save:val('save'),
    labelEn:val('labelEn'),labelAr:val('labelAr'),zoom:Number(val('zoom')||1),x:Number(val('posX')||0),y:Number(val('posY')||0),
    imagePath:existing.imagePath||null,publicImagePath:existing.publicImagePath||null,imageMeta:meta,
    img:existing.img||fileNameFromSrc(img?.src)||null,
    bgGlobal:safeJSON(localStorage.getItem(BG_GLOBAL_KEY),{theme:'luxury-black',color:'#050505'}),
    bgOverrides:safeJSON(localStorage.getItem(BG_OVERRIDE_KEY),{})
  };
}

async function uploadSelectedImage(base,id,content){
  const input=base.getElementById('imageFile');
  const file=input?.files?.[0];
  if(!file)return content;
  const ext=extFromName(file.name);
  const path=`ad-${id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
  base.getElementById('status').textContent='Uploading image securely…';
  const {error}=await db.storage.from('screen-drafts').upload(path,file,{cacheControl:'3600',contentType:file.type||undefined,upsert:false});
  if(error)throw error;
  content.imagePath=path;
  content.publicImagePath=null;
  content.img=null;
  content.imageMeta=content.imageMeta||{name:file.name,type:file.type,size:file.size};
  input.value='';
  return content;
}

async function saveCloudDraft(){
  const {base}=nested();if(!base)return;
  const id=currentId(base),status=base.getElementById('status');
  try{
    status.textContent='Saving secure draft…';
    let content=gatherContent(base,id);
    content=await uploadSelectedImage(base,id,content);
    const {data,error}=await db.from('screen_ads_draft').upsert({id,content},{onConflict:'id'}).select('id,content,version,updated_at').single();
    if(error)throw error;
    cloudDrafts[id]={...data};
    const local=safeJSON(localStorage.getItem(DRAFT_KEY),{});
    let preview=base.getElementById('pImg')?.src||null;
    if(content.imagePath){const signed=await signedDraftImage(content.imagePath);if(signed)preview=signed;cloudDrafts[id].signedImage=signed}
    local[id]={en:content.en,ar:content.ar,price:content.price,oldPrice:content.oldPrice,save:content.save,labelEn:content.labelEn,labelAr:content.labelAr,zoom:content.zoom,x:content.x,y:content.y,imageMeta:content.imageMeta,previewImage:preview};
    localStorage.setItem(DRAFT_KEY,JSON.stringify(local));
    status.textContent=`Secure draft saved · version ${data.version}. Live display unchanged.`;
    setCloudState(`Draft ${id} saved · v${data.version}`);
    notify(`Ad ${id} saved securely to Supabase.`,'ok');
    refreshBaseList();
    return data;
  }catch(e){status.textContent='Draft save failed: '+(e.message||e);notify('Draft save failed: '+(e.message||e),'bad');throw e}
}

async function preparePublicImage(id,content){
  if(!content.imagePath)return content;
  const {data:blob,error:downloadError}=await db.storage.from('screen-drafts').download(content.imagePath);
  if(downloadError)throw downloadError;
  const ext=extFromName(content.imagePath);
  const publicPath=`ad-${id}/current.${ext}`;
  const {error:uploadError}=await db.storage.from('screen-public').upload(publicPath,blob,{upsert:true,cacheControl:'3600',contentType:blob.type||undefined});
  if(uploadError)throw uploadError;
  const {data:urlData}=db.storage.from('screen-public').getPublicUrl(publicPath);
  content.publicImagePath=publicPath;
  content.img=urlData.publicUrl;
  return content;
}

async function publishCurrent(){
  const {base}=nested();if(!base)return;
  const id=currentId(base),status=base.getElementById('status');
  try{
    await saveCloudDraft();
    status.textContent='Preparing secure publish…';
    let row=cloudDrafts[id];
    let content=JSON.parse(JSON.stringify(row.content||{}));
    content=await preparePublicImage(id,content);
    if(JSON.stringify(content)!==JSON.stringify(row.content||{})){
      const {data,error}=await db.from('screen_ads_draft').update({content}).eq('id',id).select('id,content,version,updated_at').single();
      if(error)throw error;cloudDrafts[id]={...data};row=data;
    }
    const {data,error}=await db.rpc('publish_screen_ad',{p_ad_id:id});
    if(error)throw error;
    status.textContent='Published to secure screen data. Physical street display is NOT connected yet.';
    setCloudState(`Ad ${id} published to secure data`);
    notify(`Ad ${id} published to secure data layer. Live screen still unchanged.`,'ok');
    return data;
  }catch(e){status.textContent='Publish failed: '+(e.message||e);notify('Publish failed: '+(e.message||e),'bad')}
}

function refreshBaseList(){
  const {base,baseWindow}=nested();if(!base)return;
  try{if(baseWindow&&typeof baseWindow.list==='function')baseWindow.list()}catch(e){}
}

function injectSecureControls(){
  if(bound)return;
  const {base}=nested();if(!base)return;
  const save=base.getElementById('saveDraft');
  const actions=save?.parentElement;
  if(!save||!actions)return;
  bound=true;
  save.textContent='Save secure draft';
  save.onclick=()=>saveCloudDraft();
  let publish=base.getElementById('securePublish');
  if(!publish){
    publish=base.createElement('button');publish.id='securePublish';publish.className='btn primary';publish.textContent='Publish secure data';publish.onclick=()=>publishCurrent();actions.insertBefore(publish,save.nextSibling);
  }
  const note=base.querySelector('.publish-note');
  if(note)note.innerHTML='<strong>Secure cloud mode:</strong> Drafts and images are stored in Supabase. Publish writes only to the protected Published data layer. The physical street display remains unchanged until it is explicitly connected.';
  const sub=base.querySelector('.sidebar .sub');if(sub)sub.textContent='Street Display Content Manager — Secure Cloud';
  base.getElementById('status').textContent='Secure admin ready. Changes are not saved until you press Save secure draft.';
  base.addEventListener('click',e=>{if(e.target.closest('.ad-btn'))setTimeout(()=>{const id=currentId(base);setCloudState(cloudDrafts[id]?`Ad ${id} · secure draft v${cloudDrafts[id].version}`:`Ad ${id} · original / no cloud draft`)},130)});
  setCloudState(`${Object.keys(cloudDrafts).length} secure drafts loaded`);
}

function waitForAdmin(){
  let attempts=0;const timer=setInterval(()=>{attempts++;injectSecureControls();if(bound||attempts>100)clearInterval(timer)},150);
}

$('loginForm').addEventListener('submit',e=>{e.preventDefault();signIn($('email').value.trim(),$('password').value)});
$('logoutBtn').onclick=async()=>{await db.auth.signOut();user=null;cloudDrafts={};$('appFrame').src='about:blank';$('secureApp').classList.add('hidden');$('loginView').classList.remove('hidden');$('password').value='';setLoginStatus('Signed out securely.');};
$('refreshCloud').onclick=async()=>{try{await loadCloudDrafts();notify('Secure drafts refreshed. Reloading admin…','ok');bound=false;$('appFrame').src='screen-admin-linked-bg.html?refresh='+Date.now()}catch(e){notify(e.message||'Refresh failed','bad')}};
$('appFrame').addEventListener('load',waitForAdmin);

db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&!$('secureApp').classList.contains('hidden')){$('secureApp').classList.add('hidden');$('loginView').classList.remove('hidden')}});

(async()=>{
  try{
    const {data,error}=await db.auth.getUser();
    if(!error&&data?.user){setLoginStatus('Restoring secure session…');await authorize(data.user)}
  }catch(e){await db.auth.signOut().catch(()=>{});setLoginStatus('Please sign in to continue.')}
})();
})();
</script>
</body>
</html>

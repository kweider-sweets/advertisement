<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KWEIDER Production MP4 Exporter V9</title>
<style>html,body{margin:0;min-height:100%;background:#070707;color:#f3d98d;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot b{display:block;font-size:22px;letter-spacing:.08em}.boot span{display:block;margin-top:10px;color:#bcae91;font-size:13px}</style>
</head>
<body>
<div class="boot"><div><b>KWEIDER PRODUCTION EXPORTER V9</b><span>Loading zero-black-frame transition engine…</span></div></div>
<script>
(async()=>{
  'use strict';
  try{
    const res=await fetch('screen-export-production-v8.html?v=8',{cache:'no-store'});
    if(!res.ok)throw new Error('Could not load V8 base: HTTP '+res.status);
    let html=await res.text();

    const oldCompose=/function compose\(time,segments\)\{.*?return master\}/s;
    const newCompose=`function compose(time,segments){
  let idx=segments.length-1;
  for(let i=0;i<segments.length;i++){if(time<segments[i].end){idx=i;break}}
  const s=segments[idx],fade=Math.min(.34,s.dur*.07),lead=idx>0?Math.min(.34,s.dur*.07):0;
  const local=clamp(time-s.start+lead,0,s.dur);
  drawScene(sctx,s.ad,local,s.dur);
  mctx.save();
  mctx.globalAlpha=1;
  mctx.drawImage(scene,0,0);
  const next=segments[idx+1];
  if(next&&time>=s.end-fade){
    if(!compose.nextScene){compose.nextScene=document.createElement('canvas');compose.nextScene.width=FULL_W;compose.nextScene.height=FULL_H;compose.nextCtx=compose.nextScene.getContext('2d',{alpha:false})}
    const p=smooth((time-(s.end-fade))/fade);
    const nextLead=Math.min(.34,next.dur*.07);
    const nextLocal=clamp(time-next.start+nextLead,0,next.dur);
    drawScene(compose.nextCtx,next.ad,nextLocal,next.dur);
    mctx.globalAlpha=p;
    mctx.drawImage(compose.nextScene,0,0);
    mctx.globalAlpha=1;
  }
  mctx.restore();
  return master
}`;

    if(!oldCompose.test(html))throw new Error('V8 compose() signature not found; V9 patch aborted.');
    html=html.replace(oldCompose,newCompose);
    html=html.replaceAll('PRODUCTION EXPORTER V8','PRODUCTION EXPORTER V9');
    html=html.replaceAll('Production MP4 Exporter V8','Production MP4 Exporter V9');
    html=html.replaceAll('Exporter V8','Exporter V9');
    html=html.replace('V8 transition rule: each advertisement owns its own continuous timeline. The outgoing scene fades smoothly to black; the next scene then begins from its true frame 0. Image and main title use the same reveal clock.','V9 transition rule: zero-black-frame overlap crossfade. The incoming scene begins before the outgoing scene disappears, with continuous coverage across every transition. Image and main title remain on the deterministic frame clock.');
    html=html.replace('Deterministic frame renderer · fixed timeline · no DOM capture · no transition rewind','Deterministic frame renderer · fixed timeline · zero black frames · overlap crossfade');
    html=html.replace('<div class="pill">IMAGE + TITLE SYNC</div>','<div class="pill">IMAGE + TITLE SYNC</div><div class="pill">ZERO BLACK FRAME</div>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="boot"><div><b>V9 LOAD ERROR</b><span>'+String(err&&err.message||err)+'</span></div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>

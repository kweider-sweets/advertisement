<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kweider Sweets — 25 Unique Cinematic Ads • Black Image Stage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* الهوية الأساسية */
            --gold: #c5a059;
            --gold-bright: #f3d98d;
            --gold-light: #e8d090;
            --gold-dark: #8d5d10;
            --cream: #f5ead0;

            /* شاشتان عموديتان بجانب بعضهما */
            --centre-gap: clamp(38px, 1.45vw, 76px);
            /* تم تقليل الهامش لتعبئة المساحات الفارغة على الشاشات الكبيرة */
            --image-safe-margin: 0.5cm; 

            /* زيادة حجم الصورة لتقليص الفراغ */
            --image-content-size: 110%;

            /* قيم الإضاءة الافتراضية */
            --stage-background:
                radial-gradient(circle at 50% 44%, #181818 0%, #080808 60%, #010101 100%);

            --left-background:
                radial-gradient(circle at 50% 31%, rgba(243, 217, 141, 0.08), transparent 28%),
                radial-gradient(circle at 29% 75%, rgba(197, 160, 89, 0.04), transparent 30%),
                linear-gradient(180deg, #030303 0%, #090807 50%, #020202 100%);

            --right-background: #000000;

            --image-brightness: 1.02;
            --image-contrast: 1.10;
            --image-saturation: 1.04;
            --image-shadow-opacity: 0.78;
            --backdrop-opacity: 0.22;
            --text-glow-colour: rgba(240, 214, 142, 0.18);
            --price-glow-colour: rgba(240, 214, 142, 0.20);
            --logo-glow-colour: rgba(197, 160, 89, 0.42);
            --ambient-overlay-opacity: 0.12;
            --vignette-strength: 0.82;
        }

        html[data-light-mode="day"] {
            --gold: #d5b565;
            --gold-bright: #f7e2a3;
            --gold-light: #f1d894;
            --gold-dark: #9f6b13;

            --stage-background:
                radial-gradient(circle at 50% 42%, #131313 0%, #050505 58%, #000 100%);

            --left-background:
                radial-gradient(circle at 50% 30%, rgba(247, 226, 163, 0.075), transparent 27%),
                radial-gradient(circle at 27% 75%, rgba(213, 181, 101, 0.04), transparent 29%),
                linear-gradient(180deg, #010101 0%, #060606 50%, #000 100%);

            --right-background: #000000;

            --image-brightness: 1.08;
            --image-contrast: 1.16;
            --image-saturation: 1.07;
            --image-shadow-opacity: 0.86;
            --backdrop-opacity: 0.18;
            --text-glow-colour: rgba(247, 226, 163, 0.30);
            --price-glow-colour: rgba(247, 226, 163, 0.32);
            --logo-glow-colour: rgba(213, 181, 101, 0.55);
            --ambient-overlay-opacity: 0.08;
            --vignette-strength: 0.90;
        }

        html[data-light-mode="dusk"] {
            --gold: #c9a45b;
            --gold-bright: #efd58d;
            --gold-light: #e4c77c;
            --gold-dark: #89590e;

            --stage-background:
                radial-gradient(circle at 50% 44%, #1a1510 0%, #090706 56%, #020202 100%);

            --left-background:
                radial-gradient(circle at 50% 31%, rgba(239, 213, 141, 0.115), transparent 29%),
                radial-gradient(circle at 29% 75%, rgba(201, 164, 91, 0.06), transparent 31%),
                linear-gradient(180deg, #050403 0%, #0d0a07 49%, #030302 100%);

            --right-background: #000000;

            --image-brightness: 1.02;
            --image-contrast: 1.11;
            --image-saturation: 1.05;
            --image-shadow-opacity: 0.80;
            --backdrop-opacity: 0.24;
            --text-glow-colour: rgba(239, 213, 141, 0.25);
            --price-glow-colour: rgba(239, 213, 141, 0.27);
            --logo-glow-colour: rgba(201, 164, 91, 0.47);
            --ambient-overlay-opacity: 0.14;
            --vignette-strength: 0.80;
        }

        html[data-light-mode="night"] {
            --gold: #aa8748;
            --gold-bright: #d8bd78;
            --gold-light: #cbb06e;
            --gold-dark: #70480c;

            --stage-background:
                radial-gradient(circle at 50% 44%, #13110f 0%, #090807 57%, #030303 100%);

            --left-background:
                radial-gradient(circle at 50% 31%, rgba(216, 189, 120, 0.065), transparent 28%),
                radial-gradient(circle at 29% 75%, rgba(170, 135, 72, 0.035), transparent 30%),
                linear-gradient(180deg, #080706 0%, #0d0c0a 50%, #050505 100%);

            --right-background: #000000;

            --image-brightness: 0.93;
            --image-contrast: 1.07;
            --image-saturation: 0.99;
            --image-shadow-opacity: 0.70;
            --backdrop-opacity: 0.17;
            --text-glow-colour: rgba(216, 189, 120, 0.13);
            --price-glow-colour: rgba(216, 189, 120, 0.15);
            --logo-glow-colour: rgba(170, 135, 72, 0.28);
            --ambient-overlay-opacity: 0.07;
            --vignette-strength: 0.70;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .display-stage {
            position: relative;
            width: min(100vw, 112.5vh);
            height: min(100vh, 88.8889vw);
            aspect-ratio: 9 / 8;
            display: block;
            overflow: hidden;
            background: #000;
        }

        .ad-area,
        #dynamic-ad-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #dynamic-ad-area {
            position: absolute;
            inset: 0;
        }

        /* دمج فني سينمائي يغطي الشاشة بالكامل أثناء الانتقال */
        #cinematic-merger-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(
                135deg,
                transparent 0%,
                rgba(197, 160, 89, 0.1) 35%,
                rgba(243, 217, 141, 0.6) 48%,
                rgba(255, 255, 255, 0.9) 50%,
                rgba(243, 217, 141, 0.6) 52%,
                rgba(197, 160, 89, 0.1) 65%,
                transparent 100%
            );
            mix-blend-mode: screen;
            opacity: 0;
            transform: translateX(-100%);
        }

        @keyframes cinematicMergeFlash {
            0% { opacity: 0; transform: translateX(-100%) skewX(-15deg) scale(1.5); }
            20% { opacity: 1; }
            50% { opacity: 1; transform: translateX(0%) skewX(-15deg) scale(1.5); filter: blur(4px) brightness(1.5); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(100%) skewX(-15deg) scale(1.5); }
        }

        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
            width: 100%;
            height: clamp(7px, 0.38vh, 15px);
            background: #090909;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright), var(--gold-dark));
            box-shadow: 0 0 18px rgba(232, 208, 144, 0.5);
        }

        .ad-container {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 50% 50%;
            overflow: hidden;
            background: var(--stage-background);
        }

        .screen-half {
            position: relative;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .left-screen {
            padding: 2.4vh calc(var(--centre-gap) / 2 + 2.1vw) 2.1vh 2.1vw;
            background: var(--left-background);
        }

        .right-screen {
            padding: 0;
            background: #000000 !important;
        }

        .centre-seam {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            z-index: 60;
            width: var(--centre-gap);
            transform: translateX(-50%);
            pointer-events: none;
            background: linear-gradient(90deg, rgba(0,0,0,.94), #000 30%, #000 70%, rgba(0,0,0,.94));
            box-shadow: -20px 0 36px rgba(0,0,0,.68), 20px 0 36px rgba(0,0,0,.68);
        }

        .inner-frame {
            position: absolute;
            top: 1.15vh;
            bottom: 1.15vh;
            left: 1vw;
            right: 1vw;
            z-index: 2;
            pointer-events: none;
            border: 1px solid rgba(197, 160, 89, 0.28);
            box-shadow: inset 0 0 24px rgba(197, 160, 89, 0.035);
        }

        .left-screen .inner-frame {
            right: calc(var(--centre-gap) / 2 + 0.8vw);
        }

        .right-screen .inner-frame {
            left: calc(var(--centre-gap) / 2 + 0.8vw);
        }

        .text-cinematic-stage {
            position: relative;
            z-index: 8;
            width: 100%;
            height: 100%;
            opacity: 1;
            animation: stageExit 0.65s var(--exit-delay) ease-in forwards;

            --badge-delay: .18s;
            --ar-delay: .58s;
            --en-delay: 1.02s;
            --old-delay: 1.45s;
            --price-delay: 1.72s;
            --caption-delay: 2.30s;
            --rule-delay: 2.48s;
            --footer-delay: 2.72s;
            --shine-delay: 3.32s;

            --badge-name: badgeDropTilt;
            --ar-name: revealRight;
            --en-name: blurFocusUp;
            --old-name: fadeUp;
            --price-name: priceHeroScale;
            --caption-name: fadeUp;
            --rule-name: ruleDrawCenter;
            --footer-name: fadeUp;
            --accent-name: accentGrowY;

            --text-flash-name: textFlashSweepLR;
            --text-flash-delay: .34s;
            --text-flash-duration: 1.15s;
            --text-flash-opacity: .18;
            --text-flash-angle: 14deg;
            --text-flash-iterations: 1;
            --text-glint-name: textGlintDriftA;
            --text-glint-delay: .9s;
            --text-glint-duration: 8.5s;
        }

        .text-layout {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 16% 36% 30% 18%;
            text-align: center;
        }

        .ambient-layer,
        .ambient-a,
        .ambient-b,
        .ambient-c {
            position: absolute;
            pointer-events: none;
        }

        .ambient-layer {
            inset: -12%;
            z-index: -4;
            opacity: 0;
        }

        .ambient-a,
        .ambient-b,
        .ambient-c {
            z-index: -3;
            opacity: 0;
        }

        .cinematic-grain {
            position: absolute;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            opacity: .13;
            background-image:
                radial-gradient(circle at 15% 18%, rgba(232,208,144,.45) 0 1px, transparent 1.5px),
                radial-gradient(circle at 77% 31%, rgba(197,160,89,.35) 0 1px, transparent 1.4px),
                radial-gradient(circle at 37% 72%, rgba(232,208,144,.30) 0 1px, transparent 1.5px),
                radial-gradient(circle at 82% 82%, rgba(197,160,89,.25) 0 1px, transparent 1.4px);
            background-size: 180px 210px, 230px 260px, 260px 300px, 320px 350px;
            animation: grainDrift 12s linear infinite;
        }

        .accent-line {
            display: none !important;
        }

        .badge-zone {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            width: 100%;
            padding-top: 1.75vh;
            padding-left: 1.15vw;
            padding-right: 1.15vw;
            overflow: visible;
        }

        .save-badge {
            position: relative;
            overflow: hidden;
            width: auto;
            min-width: 46%;
            max-width: calc(100% - 2.3vw);
            flex: 0 0 auto;
            padding: clamp(15px, 1.25vh, 36px) clamp(25px, 1.75vw, 72px);
            border: 1px solid rgba(255,237,174,.55);
            border-radius: clamp(11px, .72vw, 23px);
            color: #090704;
            background: linear-gradient(135deg, #86560b 0%, #d8b13c 38%, #f2d678 58%, #956313 100%);
            box-shadow: 0 1.1vh 2.8vh rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.4);
            font-family: Cairo, Arial, sans-serif;
            /* تم تكبير الخط ليتناسب مع الشاشات العملاقة */
            font-size: clamp(40px, 3.5vmin, 90px); 
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: .02em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: keep-all;
            hyphens: none;
            opacity: 0;
            animation-name: var(--badge-name);
            animation-duration: .9s;
            animation-delay: var(--badge-delay);
            animation-timing-function: cubic-bezier(.16,1,.3,1);
            animation-fill-mode: forwards;
        }

        .save-badge::after {
            content: "";
            position: absolute;
            top: -40%;
            left: -58%;
            width: 30%;
            height: 185%;
            transform: rotate(18deg);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.62), transparent);
            animation: badgeShine .8s 1.15s ease-out forwards;
        }

        .text-flash-layer,
        .text-glint-field {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .text-flash-layer {
            z-index: 2;
            mix-blend-mode: screen;
        }

        .text-flash-layer::before {
            content: "";
            position: absolute;
            top: -28%;
            left: -48%;
            width: 28%;
            height: 158%;
            opacity: 0;
            transform: rotate(var(--text-flash-angle));
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 244, 203, var(--text-flash-opacity)),
                transparent
            );
            filter: blur(8px);
            animation-name: var(--text-flash-name);
            animation-duration: var(--text-flash-duration);
            animation-delay: var(--text-flash-delay);
            animation-timing-function: cubic-bezier(.18,.72,.22,1);
            animation-fill-mode: both;
            animation-iteration-count: var(--text-flash-iterations);
        }

        .text-glint-field {
            z-index: 1;
            opacity: .16;
            background-image:
                radial-gradient(circle at 18% 22%, rgba(243,217,141,.52) 0 1px, transparent 1.7px),
                radial-gradient(circle at 76% 31%, rgba(197,160,89,.42) 0 1px, transparent 1.7px),
                radial-gradient(circle at 42% 76%, rgba(232,208,144,.34) 0 1px, transparent 1.7px);
            background-size: 230px 260px, 310px 290px, 360px 390px;
            animation-name: var(--text-glint-name);
            animation-duration: var(--text-glint-duration);
            animation-delay: var(--text-glint-delay);
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        .featured {
            --text-flash-iterations: infinite;
        }

        .title-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
            margin-inline: auto;
            text-align: center;
        }

        .ad-title-ar,
        .ad-title-en {
            width: 100%;
            margin: 0;
            text-align: center;
        }

        .ad-title-ar {
            color: var(--gold-bright);
            font-family: Arial, sans-serif;
            /* تم تكبير الخط للوضوح من المسافات البعيدة */
            font-size: clamp(80px, 7.5vmin, 220px); 
            font-weight: 700;
            line-height: 1.12;
            direction: rtl;
            text-shadow: 0 0 30px var(--text-glow-colour);
        }

        .ad-title-en {
            color: var(--gold);
            font-family: Cairo, Arial, sans-serif;
            /* تكبير لتعبئة المساحة وتوضيح القراءة */
            font-size: clamp(50px, 4.5vmin, 140px); 
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: .01em;
            text-transform: uppercase;
        }

        .title-line {
            display: block;
            opacity: 0;
            animation-duration: .95s;
            animation-timing-function: cubic-bezier(.2,.8,.2,1);
            animation-fill-mode: forwards;
        }

        .ad-title-ar .title-line {
            animation-name: var(--ar-name);
            animation-delay: calc(var(--ar-delay) + var(--line-step, 0s));
        }

        .ad-title-en .title-line {
            animation-name: var(--en-name);
            animation-delay: calc(var(--en-delay) + var(--line-step, 0s));
        }

        .title-line:nth-child(2) {
            --line-step: .16s;
        }

        .title-divider {
            width: 80%;
            margin: 1.35vh auto 1.15vh;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: .8vw;
        }

        .title-divider .line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(197,160,89,.82));
            transform: scaleX(0);
            transform-origin: right;
            animation: lineDraw .8s 1.15s ease-out forwards;
        }

        .title-divider .line:last-child {
            background: linear-gradient(90deg, rgba(197,160,89,.82), transparent);
            transform-origin: left;
        }

        .title-divider .diamond {
            width: clamp(8px, .58vmin, 18px);
            aspect-ratio: 1;
            border: 1px solid var(--gold);
            opacity: 0;
            transform: rotate(45deg) scale(0);
            animation: diamondIn .5s 1.25s ease-out forwards;
        }

        .price-zone {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .old-price-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: .35vh;
            color: #ffffff;
            font-family: Cairo, Arial, sans-serif;
            /* تكبير السعر القديم */
            font-size: clamp(45px, 3.5vmin, 100px); 
            font-weight: 700;
            opacity: 0;
            animation-name: var(--old-name);
            animation-duration: .55s;
            animation-delay: var(--old-delay);
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }

        .old-price-strike {
            position: absolute;
            top: 54%;
            left: -7%;
            width: 114%;
            height: clamp(2px, .16vmin, 5px);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.92) 8%, rgba(255,255,255,.92) 92%, transparent);
            transform: scaleX(0) rotate(-4deg);
            transform-origin: left;
            animation: strikeDraw .48s calc(var(--old-delay) + .32s) ease-out forwards;
        }

        .new-price {
            position: relative;
            overflow: hidden;
            min-width: 78%;
            padding: .25vh 1.1vw .65vh;
            color: var(--gold-bright);
            font-family: Cairo, Arial, sans-serif;
            /* تكبير السعر ليلفت النظر على الفور */
            font-size: clamp(140px, 12vmin, 380px); 
            font-weight: 800;
            line-height: .98;
            letter-spacing: -.045em;
            text-shadow: 0 0 22px var(--price-glow-colour), 0 0 68px rgba(197,160,89,.10);
            opacity: 0;
            animation-name: var(--price-name);
            animation-duration: .92s;
            animation-delay: var(--price-delay);
            animation-timing-function: cubic-bezier(.16,1,.3,1);
            animation-fill-mode: forwards;
        }

        .new-price::after {
            content: "";
            position: absolute;
            top: -20%;
            left: -42%;
            width: 24%;
            height: 145%;
            transform: rotate(14deg);
            background: linear-gradient(90deg, transparent, rgba(255,247,210,.75), transparent);
            filter: blur(2px);
            animation: shineOnce 1s var(--shine-delay) ease-out forwards;
        }

        .price-caption {
            margin-top: .6vh;
            color: rgba(244,234,208,.92);
            font-family: Cairo, Arial, sans-serif;
            font-size: clamp(23px, 1.9vmin, 58px);
            font-weight: 700;
            letter-spacing: .16em;
            opacity: 0;
            animation-name: var(--caption-name);
            animation-duration: .65s;
            animation-delay: var(--caption-delay);
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }

        .price-caption .dot {
            margin: 0 .55em;
            color: var(--gold);
        }

        .offer-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-height: 0;
            margin-inline: auto;
            padding-top: .6vh;
            text-align: center;
        }

        .offer-rule {
            position: relative;
            width: 85%;
            height: 1px;
            margin-bottom: 1.7vh;
            background: linear-gradient(90deg, transparent, rgba(197,160,89,.9) 18%, rgba(232,208,144,.9) 50%, rgba(197,160,89,.9) 82%, transparent);
            transform: scaleX(0);
            animation-name: var(--rule-name);
            animation-duration: .9s;
            animation-delay: var(--rule-delay);
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }

        .offer-rule::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: clamp(8px, .58vmin, 18px);
            aspect-ratio: 1;
            border: 1px solid var(--gold);
            background: #080808;
            transform: translate(-50%, -50%) rotate(45deg) scale(0);
            animation: diamondOfferIn .5s calc(var(--rule-delay) + .28s) ease-out forwards;
        }

        .ad-footer-ar,
        .ad-footer-en {
            opacity: 0;
            animation-name: var(--footer-name);
            animation-duration: .75s;
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }

        .ad-footer-ar {
            color: var(--gold-light);
            font-family: Arial, sans-serif;
            /* تكبير لتناسب المساحة وتكون مقروءة بوضوح */
            font-size: clamp(45px, 4vmin, 110px); 
            font-weight: 700;
            line-height: 1.25;
            direction: rtl;
            animation-delay: var(--footer-delay);
        }

        .ad-footer-en {
            margin-top: .65vh;
            color: rgba(240,214,142,.9);
            font-family: Cairo, Arial, sans-serif;
            font-size: clamp(30px, 2.5vmin, 75px);
            font-weight: 600;
            font-style: italic;
            line-height: 1.2;
            animation-delay: calc(var(--footer-delay) + .18s);
        }

        :root {
            --slide-transition-duration: 1400ms;
        }

        .ad-container,
        .left-screen,
        .right-screen {
            background: #000000 !important;
        }

        .ad-slide {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 1;
            overflow: hidden;
            transform: translateZ(0);
            will-change: opacity, filter, transform;
            backface-visibility: hidden;
        }

        .ad-slide.is-current { z-index: 2; }
        .ad-slide.is-incoming { z-index: 1; }

        .ad-slide.is-leaving {
            z-index: 3;
            pointer-events: none;
            animation: cinematicBridgeOut var(--slide-transition-duration) cubic-bezier(.42, 0, .18, 1) forwards;
        }

        .ad-slide.is-leaving::after {
            content: "";
            position: absolute;
            top: -22%;
            bottom: -22%;
            left: -48%;
            z-index: 300;
            width: 30%;
            pointer-events: none;
            opacity: 0;
            transform: skewX(-10deg);
            background: linear-gradient(90deg, transparent 0%, rgba(197, 160, 89, 0.05) 24%, rgba(243, 217, 141, 0.34) 49%, rgba(255, 245, 205, 0.48) 52%, rgba(197, 160, 89, 0.08) 76%, transparent 100%);
            filter: blur(6px);
            animation: cinematicBridgeSweep var(--slide-transition-duration) cubic-bezier(.3, .65, .2, 1) forwards;
        }

        .text-cinematic-stage { animation: none !important; opacity: 1; }

        .image-entry {
            animation-name: var(--image-entry-name) !important;
            animation-duration: var(--image-entry-duration) !important;
            animation-delay: var(--image-entry-delay) !important;
            animation-timing-function: cubic-bezier(.16, 1, .3, 1) !important;
            animation-fill-mode: forwards !important;
        }

        @keyframes cinematicBridgeOut {
            0% { opacity: 1; filter: blur(0) brightness(1); transform: scale(1); }
            35% { opacity: .96; filter: blur(0) brightness(1.02); transform: scale(1.001); }
            72% { opacity: .54; filter: blur(2px) brightness(.96); transform: scale(1.006); }
            100% { opacity: 0; filter: blur(7px) brightness(.82); transform: scale(1.014); }
        }

        @keyframes cinematicBridgeSweep {
            0% { left: -48%; opacity: 0; }
            18% { opacity: .78; }
            72% { opacity: .48; }
            100% { left: 122%; opacity: 0; }
        }

        .left-screen > .inner-frame { display: none !important; }

        .left-screen, .left-screen .text-cinematic-stage, .left-screen .text-layout, .left-screen .title-zone, .left-screen .price-zone, .left-screen .offer-zone {
            border: 0 !important;
            outline: 0 !important;
            box-shadow: none !important;
        }

        .ad-slide.is-incoming.is-entering {
            z-index: 2;
            animation-name: cinematicBridgeInUnique;
            animation-duration: var(--slide-transition-duration);
            animation-timing-function: var(--bridge-ease, cubic-bezier(.2,.75,.18,1));
            animation-fill-mode: both;
            transform-origin: var(--bridge-in-origin, center center);
        }

        .ad-slide.is-leaving {
            z-index: 3;
            animation-name: cinematicBridgeOutUnique !important;
            animation-duration: var(--slide-transition-duration) !important;
            animation-timing-function: var(--bridge-ease, cubic-bezier(.42,0,.18,1)) !important;
            animation-fill-mode: forwards !important;
            transform-origin: var(--bridge-out-origin, center center);
        }

        .ad-slide.is-leaving::after {
            top: -28%;
            bottom: -28%;
            left: var(--bridge-flare-start, -48%);
            width: var(--bridge-flare-width, 28%);
            opacity: 0;
            transform: rotate(var(--bridge-flare-rotate, 0deg)) skewX(var(--bridge-flare-skew, -10deg));
            background: linear-gradient(90deg, transparent 0%, rgba(197,160,89,.02) 18%, rgba(243,217,141,var(--bridge-flare-opacity,.22)) 48%, rgba(255,248,218,.30) 52%, rgba(197,160,89,.04) 80%, transparent 100%);
            filter: blur(var(--bridge-flare-blur, 7px));
            animation-name: cinematicBridgeFlareUnique !important;
            animation-duration: var(--slide-transition-duration) !important;
            animation-timing-function: var(--bridge-ease, cubic-bezier(.3,.65,.2,1)) !important;
            animation-fill-mode: forwards !important;
        }

        @keyframes cinematicBridgeInUnique {
            0% { opacity: var(--bridge-in-opacity, .2); transform: var(--bridge-in-transform, scale(.985)); filter: var(--bridge-in-filter, blur(8px) brightness(.88)); clip-path: var(--bridge-in-clip, inset(0)); }

        }

            0% { opacity: 1; transform: none; filter: none; clip-path: var(--bridge-full-clip, inset(0)); }
            38% { opacity: .98; }
            100% { opacity: 0; transform: var(--bridge-out-transform, scale(1.015)); filter: var(--bridge-out-filter, blur(7px) brightness(.76)); clip-path: var(--bridge-out-clip, inset(0)); }

            18% { opacity: .72; }
            68% { opacity: .34; }
            100% { left: var(--bridge-flare-end, 122%); opacity: 0; }
        }

        html,

            flex: 0 0 auto;
            aspect-ratio: 9 / 8;
            overflow: hidden;

        const IMAGE_MOTION_SEQUENCE = [

            18, 4, 21, 9, 2,
            23, 10, 16, 5, 24,
            7, 15, 11, 19, 13

        const IMAGE_ENTRY_DELAYS = [
            180, 620, 340, 860, 440,
            720, 260, 980, 520, 780,
            300, 900, 460, 680, 220,
            820, 380, 1040, 560, 740,
            280, 940, 500, 660, 420

        let playOrder = [];
        let orderPosition = 0;
        let slideTimer = null;
        let transitionCleanupTimer = null;

        const SLIDE_TRANSITION_DURATION = 1400;

        function getLondonTimeParts() {
            const formatter = new Intl.DateTimeFormat(
                "en-GB",
                {
                    timeZone: LONDON_TIME_ZONE,
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }
            );

            const parts = formatter.formatToParts(new Date());
            const hourPart = parts.find(part => part.type === "hour");
            const minutePart = parts.find(part => part.type === "minute");

            let hour = Number(hourPart ? hourPart.value : 0);
            const minute = Number(minutePart ? minutePart.value : 0);

            if (hour === 24) {
                hour = 0;
            }

            return { hour, minute };
        }

        function determineLondonLightMode() {
            if (["day", "dusk", "night"].includes(FORCE_LIGHT_MODE)) {
                return FORCE_LIGHT_MODE;
            }

            const { hour, minute } = getLondonTimeParts();
            const totalMinutes = hour * 60 + minute;

            if (totalMinutes >= 420 && totalMinutes < 960) {
                return "day";
            }

            if (totalMinutes >= 960 && totalMinutes < 1200) {
                return "dusk";
            }

            return "night";
        }

        function applyLondonLightMode() {
            const mode = determineLondonLightMode();
            document.documentElement.setAttribute("data-light-mode", mode);
            document.documentElement.setAttribute("data-london-time-zone", LONDON_TIME_ZONE);
            return mode;
        }

        function buildPlayOrder() {
            const maxRepeat = Math.max(...promotionalAds.map(ad => Math.max(1, Number(ad.repeat) || 1)));
            const order = [];

            for (let round = 0; round < maxRepeat; round++) {
                promotionalAds.forEach((ad, index) => {
                    if ((Number(ad.repeat) || 1) > round) {
                        order.push(index);
                    }
                });
            }

            return order;
        }

        function createLines(lines) {
            return lines

                .join("");

        function currentAd() {
            const adIndex = playOrder[orderPosition] ?? 0;
            return promotionalAds[adIndex];

            const oldPriceValue = typeof ad.oldPrice === "string" ? ad.oldPrice.trim() : "";

            const oldPriceHTML = oldPriceValue

            template.innerHTML = buildAdMarkup(ad).trim();
            return template.content.firstElementChild;

            return Math.max(1000, Number(duration) - SLIDE_TRANSITION_DURATION);

            clearTimeout(transitionCleanupTimer);
            isTransitioning = false;

            const container = document.getElementById("dynamic-ad-area");

                return;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    currentSlide.classList.add("is-leaving", bridgeClass);
                });
            });

            transitionCleanupTimer = setTimeout(() => {
                currentSlide.remove();
                incomingSlide.classList.remove("is-incoming", "is-entering", bridgeClass);
                incomingSlide.classList.add("is-current");
                isTransitioning = false;
            }, SLIDE_TRANSITION_DURATION + 80);

            scheduleNext();
        }

        function restartProgressBar(duration) {
            const bar = document.getElementById("progress-bar");
            bar.style.transition = "none";
            bar.style.width = "0%";

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    bar.style.transition = `width ${duration}ms linear`;
                    bar.style.width = "100%";
                });
            });
        }

        function scheduleNext() {
            clearTimeout(slideTimer);

            if (isPaused || playOrder.length === 0) {
                return;
            }

            const delay = transitionStartDelay(currentAd().duration);

            slideTimer = setTimeout(() => {
                transitionToPosition(orderPosition + 1);
            }, delay);
        }

        function showNextAd() {
            clearTimeout(slideTimer);
            transitionToPosition(orderPosition + 1);
        }

        function showPreviousAd() {
            clearTimeout(slideTimer);
            transitionToPosition(orderPosition - 1);
        }

        function restartCurrentAd() {
            clearTimeout(slideTimer);

            if (isTransitioning) {
                return;
            }

            transitionToPosition(orderPosition);
        }

        function togglePause() {
            if (isTransitioning) {
                return;
            }

            isPaused = !isPaused;
            clearTimeout(slideTimer);

            const animatedElements = document.querySelectorAll(
                ".ad-slide, .ad-slide *, .progress-bar"
            );
            const state = isPaused ? "paused" : "running";

            animatedElements.forEach(element => {
                element.style.animationPlayState = state;
            });

            if (!isPaused) {
                renderAd();
                scheduleNext();
            }
        }

        function enterFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function preloadImages() {
            const uniqueImages = [...new Set(promotionalAds.map(ad => ad.img))];
            uniqueImages.forEach(src => {
                const image = new Image();
                image.src = src;
            });
        }

        function startSlideshow() {
            applyLondonLightMode();
            playOrder = buildPlayOrder();
            orderPosition = 0;
            preloadImages();
            renderAd();
            scheduleNext();
        }

        document.addEventListener("keydown", event => {
            if (event.key.toLowerCase() === "f") {
                enterFullscreen();
            }

            if (event.key === "ArrowRight") {
                showNextAd();
            }

            if (event.key === "ArrowLeft") {
                showPreviousAd();
            }

            if (event.key.toLowerCase() === "r") {
                restartCurrentAd();
            }

            if (event.code === "Space") {
                event.preventDefault();
                togglePause();
            }
        });

        document.addEventListener("dblclick", enterFullscreen);
        setInterval(applyLondonLightMode, 60000);
        window.addEventListener("load", startSlideshow);
    </script>
</body>
</html>

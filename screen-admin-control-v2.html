<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://hbloyloryxksbsornjlg.supabase.co wss://hbloyloryxksbsornjlg.supabase.co; frame-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>KWEIDER Screen Control V2</title>
<style>
:root{--gold:#c5a059;--gold2:#f3d98d;--bg:#080808;--line:#332b20;--muted:#a99d89}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif;color:#fff}
.shell{height:100%;display:grid;grid-template-rows:48px 1fr}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0b0b}.left,.right{display:flex;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:.16em;color:var(--gold2);font-size:13px}.sub{font-size:11px;color:var(--muted)}.pill{border:1px solid #3d5138;border-radius:999px;padding:4px 8px;color:#bfe2b8;font-size:10px;font-weight:800}.btn{border:1px solid var(--gold);background:#15120e;color:#ead89f;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.12)}#frame{width:100%;height:100%;border:0;background:#080808}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;place-items:center;padding:20px}.modal.open{display:grid}.card{width:min(760px,100%);max-height:min(82vh,760px);overflow:auto;background:#0d0d0d;border:1px solid #493c27;border-radius:16px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.68)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.title{font-weight:900;color:var(--gold2)}.close{border:1px solid #5f4141;background:#161010;color:#efb1b1;border-radius:8px;padding:7px 10px;cursor:pointer}.status{font-size:12px;color:var(--muted);margin:8px 0 14px}.versions{display:grid;gap:10px}.version{border:1px solid #30291f;border-radius:12px;padding:12px;background:#111}.vrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.meta{font-size:11px;color:#ad9f86;margin-top:5px}.date{direction:ltr;unicode-bidi:isolate}.badge{display:inline-block;border:1px solid #5a4930;border-radius:999px;padding:3px 7px;font-size:10px;color:#e2ca86}.restore{margin-top:10px;border:1px solid #9a7a31;background:linear-gradient(135deg,#7e5d12,#c6a33f);color:#090704;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}.restore:disabled{opacity:.5;cursor:wait}.empty{padding:18px;border:1px dashed #403522;border-radius:12px;color:#aa9f8e;text-align:center}.note{margin-top:14px;padding:10px 12px;border:1px solid #3b3224;border-radius:9px;background:#0b0906;color:#cdbd9f;font-size:11px;line-height:1.5}
@media(max-width:700px){.sub{display:none}.bar{padding:0 8px}.brand{font-size:11px}.btn{padding:6px 8px}.pill{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="shell">
  <div class="bar">
    <div class="left"><span class="brand">KWEIDER SCREEN CONTROL</span><span class="pill">V2</span><span class="sub">Secure admin · operational controls · version history</span></div>
    <div class="right"><button class="btn" id="historyBtn">History / Restore</button></div>
  </div>
  <iframe id="frame" src="screen-admin-secure-v2.html" title="KWEIDER secure admin V2"></iframe>
</div>
<div class="modal" id="modal">
  <div class="card">
    <div class="head"><div><div class="title" id="modalTitle">Version History</div><div class="status" id="modalStatus">Loading…</div></div><button class="close" id="closeBtn">Close</button></div>
    <div class="versions" id="versions"></div>
    <div class="note">Restore is deliberately safe: the selected version is copied back to <strong>Draft only</strong>. It does not overwrite Published data. Review the restored Draft, then publish manually if you approve it.</div>
  </div>
</div>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://hbloyloryxksbsornjlg.supabase.co';
const SUPABASE_KEY='sb_publishable_6oq2EgVDzMHkzxlRgwFdSw_MPU2DmaN';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
function baseDoc(){try{const s=$('frame').contentDocument;if(!s)return null;const a=s.getElementById('appFrame')?.contentDocument;if(!a)return null;const l=a.getElementById('manager')?.contentDocument;if(!l)return null;return l.getElementById('adminFrame')?.contentDocument||null}catch(e){return null}}
function currentAd(){const d=baseDoc(),b=d?.querySelector('.ad-btn.active'),m=b?.textContent.match(/Ad\s+(\d+)/i);return m?Number(m[1]):1}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
function fmtDate(v){try{return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/London'}).format(new Date(v))}catch(e){return v}}
async function ensureAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('Sign in to the secure admin first.');const {data,error}=await db.from('screen_admins').select('role').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data||data.role!=='admin')throw new Error('This account is not authorised.');return user}
async function loadHistory(){
  const id=currentAd();$('modal').classList.add('open');$('modalTitle').textContent=`Ad ${id} — Version History`;$('modalStatus').textContent='Loading secure history…';$('versions').innerHTML='';
  try{
    await ensureAdmin();const {data,error}=await db.from('screen_ad_versions').select('version_id,ad_id,source_version,created_at,content').eq('ad_id',id).order('version_id',{ascending:false});if(error)throw error;
    if(!data?.length){$('modalStatus').textContent='No published versions yet.';$('versions').innerHTML='<div class="empty">This advertisement has no version history yet.</div>';return}
    $('modalStatus').textContent=`${data.length} published version${data.length===1?'':'s'} found. Newest first.`;
    $('versions').innerHTML=data.map((v,i)=>{const c=v.content||{};const active=c.active===false?'Inactive':'Active';const ord=Number(c.displayOrder??v.ad_id);const dur=Number(c.durationSec??7);return `<div class="version"><div class="vrow"><div><strong>Version ${v.version_id}</strong> <span class="badge">Draft v${v.source_version}</span><div class="meta date">${esc(fmtDate(v.created_at))}</div></div><div class="meta">${i===0?'Latest published':'Previous'}</div></div><div class="meta" style="margin-top:9px">${esc(c.en||c.ar||'Advertisement '+id)}${c.save?' · '+esc(c.save):''}${c.price?' · '+esc(c.price):''}</div><div class="meta">${active} · Order #${ord} · ${dur}s</div><button class="restore" data-version="${v.version_id}" data-ad="${id}">Restore this version to Draft</button></div>`}).join('');
    $('versions').querySelectorAll('.restore').forEach(btn=>btn.onclick=()=>restore(btn));
  }catch(e){$('modalStatus').textContent=e.message||String(e);$('versions').innerHTML='<div class="empty">Unable to load history.</div>'}
}
async function restore(btn){
  const ad=Number(btn.dataset.ad),version=Number(btn.dataset.version);if(!confirm(`Restore Version ${version} of Ad ${ad} to Draft?\n\nPublished content will NOT change.`))return;
  btn.disabled=true;btn.textContent='Restoring…';
  try{await ensureAdmin();const {error}=await db.rpc('restore_screen_ad_version_to_draft',{p_ad_id:ad,p_version_id:version});if(error)throw error;$('modalStatus').textContent=`Version ${version} restored to Draft. Published content remains unchanged.`;btn.textContent='Restored to Draft';setTimeout(()=>{$('frame').contentWindow.location.reload();$('modal').classList.remove('open')},700)}
  catch(e){btn.disabled=false;btn.textContent='Restore this version to Draft';$('modalStatus').textContent='Restore failed: '+(e.message||e)}
}
$('historyBtn').onclick=loadHistory;$('closeBtn').onclick=()=>$('modal').classList.remove('open');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWEIDER Production Exporter</title><style>html,body{margin:0;min-height:100%;background:#070707;color:#f3d98d;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot b{font-size:22px;letter-spacing:.08em}.boot span{display:block;margin-top:10px;color:#bcae91}</style></head>
<body><div class="boot"><div><b>KWEIDER PRODUCTION EXPORTER</b><span>Loading per-ad Draft renderer…</span></div></div>
<script>
function visualOf(ad){const v=ad.visual||{};return{fontSizes:{badge:34,en:100,ar:72,old:47,price:182,footerAr:43,footerEn:31,...(v.fontSizes||{})},colors:{badgeText:'#090704',badgeBg:'#C8A03A',en:'#F3D98D',ar:'#C5A059',old:'#F5EAD0',price:'#F3D98D',footerAr:'#DBC783',footerEn:'#BBA96E',...(v.colors||{})},imageFx:v.imageFx||{type:'static',intensity:30},sceneFx:v.sceneFx||{type:'off',intensity:42}}}
function perAdBgColor(ad){const direct=ad?.background?.color;if(/^#[0-9a-f]{6}$/i.test(String(direct||'')))return String(direct).toUpperCase();const ov=ad?.bgOverrides?.[ad.id];if(ov?.enabled&&/^#[0-9a-f]{6}$/i.test(String(ov.color||'')))return String(ov.color).toUpperCase();const old=ad?.bgGlobal?.color;if(/^#[0-9a-f]{6}$/i.test(String(old||'')))return String(old).toUpperCase();return'#050505'}
function imageMotionFor(ad,t,dur){const v=visualOf(ad),ix=v.imageFx||{},k=clamp(Number(ix.intensity||30)/100,.1,.8),p=clamp(t/Math.max(.01,dur),0,1);if(ix.type==='static')return{x:0,y:0,s:1};if(ix.type==='cinematic-push'||ix.type==='push-halo')return{x:8*k*p,y:-6*k*p,s:1+.025*k*p};if(ix.type==='editorial-drift')return{x:lerp(-10*k,10*k,p),y:lerp(4*k,-4*k,p),s:1.005+.005*p};return{x:0,y:0,s:1}}
function sceneMotionFor(ad,t,dur,isImage=false){const sx=visualOf(ad).sceneFx||{},k=clamp(Number(sx.intensity||42)/100,.1,.9),p=smooth(t/Math.max(.01,dur));if(sx.type==='editorial-push')return{x:(isImage?10:-6)*k*p,s:isImage?1+.018*k*p:1};if(sx.type==='depth-drift')return{x:lerp((isImage?-12:8)*k,(isImage?12:-8)*k,p),s:1};return{x:0,s:1}}
function unifiedDrawScene(ctx,ad,t,dur){ctx.save();ctx.clearRect(0,0,FULL_W,FULL_H);ctx.fillStyle=bgColor(ad);ctx.fillRect(0,0,FULL_W,FULL_H);const v=visualOf(ad),fs=v.fontSizes,c=v.colors,reveal=easeOut((t-.18)/.62),badgeA=easeOut(t/.42),priceA=easeOut((t-.72)/.62),footerA=easeOut((t-1.15)/.7),bmp=images.get(ad.id);let g=ctx.createRadialGradient(520,560,0,520,560,1000);g.addColorStop(0,'rgba(243,217,141,.045)');g.addColorStop(.55,'rgba(197,160,89,.012)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,HALF_W,FULL_H);if(v.sceneFx&&v.sceneFx.type==='gallery-spotlight'){const k=clamp(Number(v.sceneFx.intensity||42)/100,.1,.9),p=smooth(t/Math.max(.01,dur)),x=HALF_W*(.15+.7*p),sp=ctx.createRadialGradient(x,780,0,x,780,720);sp.addColorStop(0,'rgba(126,91,32,'+(.14*k)+')');sp.addColorStop(.48,'rgba(197,160,89,'+(.045*k)+')');sp.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sp;ctx.fillRect(0,0,FULL_W,FULL_H)}if((v.imageFx.type==='ambient-halo'||v.imageFx.type==='push-halo')&&bmp){const k=clamp(Number(v.imageFx.intensity||30)/100,.1,.8),h=ctx.createRadialGradient(1620,920,0,1620,920,660);h.addColorStop(0,'rgba(197,160,89,'+(.12*k)+')');h.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=h;ctx.fillRect(HALF_W,0,HALF_W,FULL_H)}if(bmp){const im=imageMotionFor(ad,t,dur),sm=sceneMotionFor(ad,t,dur,true),safeW=930,safeH=1760,fit=Math.min(safeW/bmp.width,safeH/bmp.height)*.9,scale=fit*Number(ad.zoom||1)*im.s*sm.s,cx=1620+Number(ad.x||0)/100*HALF_W+im.x+sm.x,cy=960+Number(ad.y||0)/100*FULL_H+im.y,w=bmp.width*scale,h=bmp.height*scale;ctx.save();ctx.globalAlpha=reveal;ctx.filter='brightness(1.03) contrast(1.015) saturate(1.015) drop-shadow(0 40px 58px rgba(0,0,0,.62))';ctx.drawImage(bmp,cx-w/2,cy-h/2,w,h);ctx.restore()}const center=540,tm=sceneMotionFor(ad,t,dur,false);ctx.save();ctx.translate(tm.x,0);if(ad.save){ctx.save();ctx.globalAlpha=badgeA;ctx.font='800 34px Cairo,Arial';const bw=Math.min(700,Math.max(260,ctx.measureText(ad.save).width+150)),bh=86,x=center-bw/2,y=150;ctx.fillStyle=c.badgeBg||'#C8A03A';rounded(ctx,x,y,bw,bh,18);ctx.fill();ctx.fillStyle=c.badgeText||'#090704';ctx.font='800 '+Number(fs.badge||34)+'px Cairo,Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ad.save,center,y+bh/2);ctx.restore()}ctx.save();ctx.translate(0,(1-reveal)*18);text(ctx,ad.en,center,555,fitSize(ctx,ad.en,880,Number(fs.en||100),42),c.en,reveal,false,'800');text(ctx,ad.ar,center,690,fitSize(ctx,ad.ar,880,Number(fs.ar||72),38),c.ar,reveal,true,'700');ctx.restore();ctx.save();ctx.translate(0,(1-priceA)*15);text(ctx,ad.oldPrice,center,1015,Number(fs.old||47),c.old,priceA,false,'600');if(ad.price){const pulse=1+.02*Math.max(0,Math.sin((t-2.8)*Math.PI/1.8));ctx.save();ctx.translate(center,1220);ctx.scale(pulse,pulse);text(ctx,ad.price,0,0,Number(fs.price||182),c.price,priceA,false,'800');ctx.restore()}ctx.restore();text(ctx,ad.labelAr,center,1575,Number(fs.footerAr||43),c.footerAr,footerA,true,'700');text(ctx,ad.labelEn,center,1660,Number(fs.footerEn||31),c.footerEn,footerA,false,'600');ctx.restore();ctx.fillStyle='rgba(197,160,89,.06)';ctx.fillRect(HALF_W-1,0,2,FULL_H);const vg=ctx.createRadialGradient(FULL_W/2,FULL_H/2,760,FULL_W/2,FULL_H/2,1550);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=vg;ctx.fillRect(0,0,FULL_W,FULL_H);ctx.restore()}
(async()=>{'use strict';try{const r=await fetch('screen-export-production-v8.html?per-ad=1',{cache:'no-store'});if(!r.ok)throw new Error('Base renderer HTTP '+r.status);let html=await r.text();const patch=[visualOf.toString(),perAdBgColor.toString(),imageMotionFor.toString(),sceneMotionFor.toString(),unifiedDrawScene.toString(),'bgColor=perAdBgColor;','drawScene=unifiedDrawScene;'].join('\n');if(!html.includes('function segmentsFor(loops,test)'))throw new Error('Renderer marker not found');html=html.replace('function segmentsFor(loops,test)',patch+'\nfunction segmentsFor(loops,test)');const oldCompose=/function compose\(time,segments\)\{.*?return master\}/s;const newCompose="function compose(time,segments){let idx=segments.length-1;for(let i=0;i<segments.length;i++){if(time<segments[i].end){idx=i;break}}const s=segments[idx],fade=Math.min(.34,s.dur*.07),PRE_ROLL=1.55,sceneDur=Math.max(.01,Number(s.ad.durationSec||s.dur)),elapsed=clamp(time-s.start,0,s.dur),lead=idx>0?Math.min(PRE_ROLL,Math.max(0,sceneDur-.05)):0,local=idx>0?clamp(elapsed+lead*(1-elapsed/sceneDur),0,sceneDur):clamp(elapsed,0,sceneDur);drawScene(sctx,s.ad,local,sceneDur);mctx.save();mctx.globalAlpha=1;mctx.drawImage(scene,0,0);const next=segments[idx+1];if(next&&time>=s.end-fade){if(!compose.nextScene){compose.nextScene=document.createElement('canvas');compose.nextScene.width=FULL_W;compose.nextScene.height=FULL_H;compose.nextCtx=compose.nextScene.getContext('2d',{alpha:false})}const p=smooth((time-(s.end-fade))/fade),nextSceneDur=Math.max(.01,Number(next.ad.durationSec||next.dur)),nextLead=Math.min(PRE_ROLL,Math.max(0,nextSceneDur-.05)),nextLocal=clamp(nextLead-fade+(time-(s.end-fade)),0,nextSceneDur);drawScene(compose.nextCtx,next.ad,nextLocal,nextSceneDur);mctx.globalAlpha=p;mctx.drawImage(compose.nextScene,0,0);mctx.globalAlpha=1}mctx.restore();return master}";if(!oldCompose.test(html))throw new Error('Transition marker not found');html=html.replace(oldCompose,newCompose);html=html.replaceAll('PRODUCTION EXPORTER V8','PRODUCTION EXPORTER');html=html.replaceAll('Production MP4 Exporter V8','Production MP4 Exporter');html=html.replace('Deterministic frame renderer · fixed timeline · no DOM capture · no transition rewind','Per-ad Draft renderer · each advertisement keeps its own background, typography, colours and motion · zero black flash · no freeze');html=html.replace('V8 transition rule: each advertisement owns its own continuous timeline. The outgoing scene fades smoothly to black; the next scene then begins from its true frame 0. Image and main title use the same reveal clock.','Per-ad renderer: each advertisement uses its own saved visual settings. Zero-black/no-freeze overlap transition is retained internally.');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>EXPORTER LOAD ERROR</b><span>'+String(e&&e.message||e)+'</span></div></div>';console.error(e)}})();
</script></body></html>

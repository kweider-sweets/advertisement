<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWEIDER Production Exporter</title><style>html,body{margin:0;min-height:100%;background:#070707;color:#f3d98d;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot b{font-size:22px;letter-spacing:.08em}.boot span{display:block;margin-top:10px;color:#bcae91}</style></head>
<body><div class="boot"><div><b>KWEIDER PRODUCTION EXPORTER</b><span>Loading per-ad Draft renderer…</span></div></div>
<script>
function visualOf(ad){const v=ad.visual||{};return{fontSizes:{badge:34,en:100,ar:72,old:47,price:182,footerAr:43,footerEn:31,...(v.fontSizes||{})},colors:{badgeText:'#090704',badgeBg:'#C8A03A',en:'#F3D98D',ar:'#C5A059',old:'#F5EAD0',price:'#F3D98D',footerAr:'#DBC783',footerEn:'#BBA96E',...(v.colors||{})},imageFx:v.imageFx||{type:'static',intensity:30},sceneFx:v.sceneFx||{type:'off',intensity:42}}}
function perAdBgColor(ad){const direct=ad?.background?.color;if(/^#[0-9a-f]{6}$/i.test(String(direct||'')))return String(direct).toUpperCase();const ov=ad?.bgOverrides?.[ad.id];if(ov?.enabled&&/^#[0-9a-f]{6}$/i.test(String(ov.color||'')))return String(ov.color).toUpperCase();const old=ad?.bgGlobal?.color;if(/^#[0-9a-f]{6}$/i.test(String(old||'')))return String(old).toUpperCase();return'#050505'}
function imageMotionFor(ad,t,dur){const v=visualOf(ad),ix=v.imageFx||{},k=clamp(Number(ix.intensity||30)/100,.1,.8),p=clamp(t/Math.max(.01,dur),0,1);if(ix.type==='static')return{x:0,y:0,s:1};if(ix.type==='cinematic-push'||ix.type==='push-halo')return{x:8*k*p,y:-6*k*p,s:1+.025*k*p};if(ix.type==='editorial-drift')return{x:lerp(-10*k,10*k,p),y:lerp(4*k,-4*k,p),s:1.005+.005*p};return{x:0,y:0,s:1}}
function sceneMotionFor(ad,t,dur,isImage=false){const sx=visualOf(ad).sceneFx||{},k=clamp(Number(sx.intensity||42)/100,.1,.9),p=smooth(t/Math.max(.01,dur));if(sx.type==='editorial-push')return{x:(isImage?10:-6)*k*p,s:isImage?1+.018*k*p:1};if(sx.type==='depth-drift')return{x:lerp((isImage?-12:8)*k,(isImage?12:-8)*k,p),s:1};return{x:0,s:1}}
function unifiedDrawScene(ctx,ad,t,dur){window.KweiderDesign.render(ctx,ad,images,t,dur)}
(async()=>{'use strict';try{const r=await fetch('screen-export-production-v8.html?per-ad=1',{cache:'no-store'});if(!r.ok)throw new Error('Base renderer HTTP '+r.status);let html=await r.text();html=html.replace('</head>','<script src="screen-design-engine.js"><'+'/script></head>');const patch=[visualOf.toString(),perAdBgColor.toString(),imageMotionFor.toString(),sceneMotionFor.toString(),unifiedDrawScene.toString(),'bgColor=perAdBgColor;','drawScene=unifiedDrawScene;'].join('\n');if(!html.includes('function segmentsFor(loops,test)'))throw new Error('Renderer marker not found');html=html.replace('function segmentsFor(loops,test)',patch+'\nfunction segmentsFor(loops,test)');const oldCompose=/function compose\(time,segments\)\{.*?return master\}/s;const newCompose="function compose(time,segments){let idx=segments.length-1;for(let i=0;i<segments.length;i++){if(time<segments[i].end){idx=i;break}}const s=segments[idx],fade=Math.min(Number(s.ad.transitionSec??.34),s.dur*.25),PRE_ROLL=1.55,sceneDur=Math.max(.01,Number(s.ad.durationSec||s.dur)),elapsed=clamp(time-s.start,0,s.dur),lead=idx>0?Math.min(PRE_ROLL,Math.max(0,sceneDur-.05)):0,local=idx>0?clamp(elapsed+lead*(1-elapsed/sceneDur),0,sceneDur):clamp(elapsed,0,sceneDur);drawScene(sctx,s.ad,local,sceneDur);mctx.save();mctx.globalAlpha=1;mctx.drawImage(scene,0,0);const next=segments[idx+1];if(next&&time>=s.end-fade){if(!compose.nextScene){compose.nextScene=document.createElement('canvas');compose.nextScene.width=FULL_W;compose.nextScene.height=FULL_H;compose.nextCtx=compose.nextScene.getContext('2d',{alpha:false})}const p=smooth((time-(s.end-fade))/fade),nextSceneDur=Math.max(.01,Number(next.ad.durationSec||next.dur)),nextLead=Math.min(PRE_ROLL,Math.max(0,nextSceneDur-.05)),nextLocal=clamp(nextLead-fade+(time-(s.end-fade)),0,nextSceneDur);drawScene(compose.nextCtx,next.ad,nextLocal,nextSceneDur);mctx.globalAlpha=p;mctx.drawImage(compose.nextScene,0,0);mctx.globalAlpha=1}mctx.restore();return master}";if(!oldCompose.test(html))throw new Error('Transition marker not found');html=html.replace(oldCompose,newCompose);html=html.replaceAll('PRODUCTION EXPORTER V8','PRODUCTION EXPORTER');html=html.replaceAll('Production MP4 Exporter V8','Production MP4 Exporter');html=html.replace('Deterministic frame renderer · fixed timeline · no DOM capture · no transition rewind','Per-ad Draft renderer · each advertisement keeps its own background, typography, colours and motion · zero black flash · no freeze');html=html.replace('V8 transition rule: each advertisement owns its own continuous timeline. The outgoing scene fades smoothly to black; the next scene then begins from its true frame 0. Image and main title use the same reveal clock.','Per-ad renderer: each advertisement uses its own saved visual settings. Zero-black/no-freeze overlap transition is retained internally.');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>EXPORTER LOAD ERROR</b><span>'+String(e&&e.message||e)+'</span></div></div>';console.error(e)}})();
</script></body></html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KWEIDER — Left 180 Test</title>
<style>
:root{--burgundy:#53131C;--cream:#FAF6F0;--gold:#C6A15B;--black:#0F0F10}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Tahoma,sans-serif}
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:absolute;width:1210px;height:1078px;left:50%;top:50%;margin-left:-605px;margin-top:-539px;transform-origin:center;overflow:hidden;background:#000}
.half{position:absolute;top:0;width:605px;height:1078px;overflow:hidden}.left{left:0;background:linear-gradient(160deg,#1b0509 0%,#53131c 52%,#1a0508 100%);transform:rotate(180deg)}.right{left:605px;background:radial-gradient(circle at 50% 50%,#2b160d 0%,#090504 55%,#000 100%)}
.left:before{content:"";position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 43%,rgba(255,239,198,.18) 49%,rgba(255,255,255,.35) 50%,rgba(255,239,198,.16) 51%,transparent 57%);animation:sweep 5.5s ease-in-out infinite}
.frame{position:absolute;inset:20px;border:2px solid rgba(198,161,91,.48);border-radius:24px}
.logo{position:absolute;top:90px;left:40px;right:40px;text-align:center;font-size:64px;font-weight:800;letter-spacing:10px;color:var(--gold);animation:fade .7s .1s both}.heritage{position:absolute;top:175px;left:50px;right:50px;text-align:center;color:#ead9b2;font-size:18px;letter-spacing:2.5px;animation:fade .7s .35s both}.title{position:absolute;top:330px;left:30px;right:30px;text-align:center;color:var(--cream);font-size:78px;line-height:.96;font-weight:900;animation:up .8s .8s both}.arabic{position:absolute;top:520px;left:30px;right:30px;text-align:center;color:#f0ddb0;font-size:42px;font-weight:700;direction:rtl;animation:up .8s 1.1s both}.price{position:absolute;top:630px;left:0;right:0;text-align:center;color:#fff;font-size:92px;font-weight:900;animation:pop .65s 1.45s both}.caption{position:absolute;bottom:110px;left:50px;right:50px;text-align:center;color:#ead9b2;font-size:22px;letter-spacing:2px;animation:fade .7s 1.9s both}
.product{position:absolute;inset:65px;display:flex;align-items:center;justify-content:center}.orbit{position:absolute;width:430px;height:430px;border:2px solid rgba(198,161,91,.55);border-radius:50%;animation:spin 12s linear infinite}.orbit:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);top:18px;left:82px;box-shadow:0 0 24px var(--gold)}.dish{position:relative;width:330px;height:330px;border-radius:50%;background:#d89023;border:18px solid #f8ecd5;box-shadow:0 35px 60px rgba(0,0,0,.65);animation:float 4.5s ease-in-out infinite}.dish:before{content:"";position:absolute;inset:30px;border-radius:50%;background:repeating-radial-gradient(circle at 48% 52%,#efb343 0 7px,#d98d20 8px 15px)}.dish:after{content:"";position:absolute;width:78px;height:46px;border-radius:50%;background:#56733a;left:50%;top:50%;transform:translate(-50%,-50%)}
.corner{position:absolute;width:85px;height:85px}.c1{left:24px;top:24px;border-left:3px solid var(--gold);border-top:3px solid var(--gold)}.c2{right:24px;top:24px;border-right:3px solid var(--gold);border-top:3px solid var(--gold)}.c3{left:24px;bottom:24px;border-left:3px solid var(--gold);border-bottom:3px solid var(--gold)}.c4{right:24px;bottom:24px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold)}.seam{position:absolute;left:602px;top:0;width:6px;height:1078px;background:#000;z-index:20}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}@keyframes sweep{0%,25%{transform:translateX(-70%);opacity:0}35%{opacity:1}55%{transform:translateX(70%);opacity:.8}65%,100%{transform:translateX(70%);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
<section class="half left"><div class="frame"></div><div class="logo">KWEIDER</div><div class="heritage">A LEGACY OF DAMASCENE LUXURY SINCE 1969</div><div class="title">NABULSI<br>KUNAFA</div><div class="arabic">كنافة نابلسية</div><div class="price">£7.00</div><div class="caption">AUTHENTIC • FRESH • MADE TO ENJOY</div></section>
<section class="half right"><div class="product"><div class="orbit"></div><div class="dish"></div></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></section>
<div class="seam"></div></div></div>
<script>(function(){const s=document.getElementById('stage');function fit(){s.style.transform='scale('+Math.min(innerWidth/1210,innerHeight/1078)+')'}addEventListener('resize',fit,{passive:true});fit()})();</script>
</body></html>

<style>html,body{margin:0;min-height:100%;background:#070707;color:#f3d98d;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot b{display:block;font-size:22px;letter-spacing:.08em}.boot span{display:block;margin-top:10px;color:#bcae91;font-size:13px}</style>
</head><body><div class="boot"><div><b>KWEIDER PRODUCTION EXPORTER V12</b><span>Loading typography + cinematic motion engine…</span></div></div>
<script>
(async()=>{'use strict';try{
const res=await fetch('screen-export-production-v8.html?v=8',{cache:'no-store'});if(!res.ok)throw new Error('Could not load V8 base: HTTP '+res.status);let html=await res.text();
const oldCompose=/function compose\(time,segments\)\{.*?return master\}/s;
const newCompose=`function compose(time,segments){
  let idx=segments.length-1;for(let i=0;i<segments.length;i++){if(time<segments[i].end){idx=i;break}}
  const s=segments[idx],fade=Math.min(.34,s.dur*.07),PRE_ROLL=1.55,sceneDur=Math.max(.01,Number(s.ad.durationSec||s.dur)),elapsed=clamp(time-s.start,0,s.dur),lead=idx>0?Math.min(PRE_ROLL,Math.max(0,sceneDur-.05)):0;
  const local=idx>0?clamp(elapsed+lead*(1-elapsed/sceneDur),0,sceneDur):clamp(elapsed,0,sceneDur);drawScene(sctx,s.ad,local,sceneDur);mctx.save();mctx.globalAlpha=1;mctx.drawImage(scene,0,0);
  const next=segments[idx+1];if(next&&time>=s.end-fade){if(!compose.nextScene){compose.nextScene=document.createElement('canvas');compose.nextScene.width=FULL_W;compose.nextScene.height=FULL_H;compose.nextCtx=compose.nextScene.getContext('2d',{alpha:false})}const p=smooth((time-(s.end-fade))/fade),nextSceneDur=Math.max(.01,Number(next.ad.durationSec||next.dur)),nextLead=Math.min(PRE_ROLL,Math.max(0,nextSceneDur-.05)),nextLocal=clamp(nextLead-fade+(time-(s.end-fade)),0,nextSceneDur);drawScene(compose.nextCtx,next.ad,nextLocal,nextSceneDur);mctx.globalAlpha=p;mctx.drawImage(compose.nextScene,0,0);mctx.globalAlpha=1}mctx.restore();return master
}`;
if(!oldCompose.test(html))throw new Error('V8 compose() signature not found; V12 patch aborted.');html=html.replace(oldCompose,newCompose);
const marker='function drawScene(ctx,ad,t,dur){';if(!html.includes(marker))throw new Error('V8 drawScene() signature not found.');
const helpers=`function visualFs(ad,key,def){const n=Number(ad?.visual?.fontSizes?.[key]);return Number.isFinite(n)?n:def}
function visualMotion(ad,key,t){const m=ad?.visual?.motion?.[key];if(!m||!m.effect||m.effect==='default')return null;const duration=Math.max(.15,Number(m.duration||.7)),delay=Math.max(0,Number(m.delay||0)),p=easeOut((t-delay)/duration);let x=0,y=0,s=1;switch(m.effect){case'zoom-in':s=lerp(.72,1,p);break;case'zoom-out':s=lerp(1.25,1,p);break;case'left':x=lerp(-180,0,p);break;case'right':x=lerp(180,0,p);break;case'up':y=lerp(120,0,p);break;case'soft-pop':s=p<.72?lerp(.82,1.045,p/.72):lerp(1.045,1,(p-.72)/.28);break;case'cinematic':x=lerp(140,0,p);s=lerp(.93,1,p);break}return{a:p,x,y,s}}
function applyVisualMotion(ctx,m,cx,cy){if(!m)return;ctx.translate(m.x||0,m.y||0);if(m.s!==1){ctx.translate(cx,cy);ctx.scale(m.s,m.s);ctx.translate(-cx,-cy)}}
`;
html=html.replace(marker,helpers+marker);
const revealOld="const reveal=easeOut((t-.18)/.62),badge=easeOut(t/.42),price=easeOut((t-.72)/.62),footer=easeOut((t-1.15)/.7),bmp=images.get(ad.id);";
const revealNew="const titleM=visualMotion(ad,'title',t),badgeM=visualMotion(ad,'badge',t),priceM=visualMotion(ad,'price',t),footerM=visualMotion(ad,'footer',t),imageM=visualMotion(ad,'image',t),reveal=titleM?titleM.a:easeOut((t-.18)/.62),badge=badgeM?badgeM.a:easeOut(t/.42),price=priceM?priceM.a:easeOut((t-.72)/.62),footer=footerM?footerM.a:easeOut((t-1.15)/.7),bmp=images.get(ad.id);";
if(!html.includes(revealOld))throw new Error('V8 reveal clock not found.');html=html.replace(revealOld,revealNew);
html=html.replace("scale=fit*Number(ad.zoom||1)*m.s,cx=1620+Number(ad.x||0)/100*HALF_W+m.x,cy=960+Number(ad.y||0)/100*FULL_H+m.y,w=bmp.width*scale,h=bmp.height*scale;ctx.save();ctx.globalAlpha=reveal;","scale=fit*Number(ad.zoom||1)*m.s*(imageM?imageM.s:1),cx=1620+Number(ad.x||0)/100*HALF_W+m.x+(imageM?imageM.x:0),cy=960+Number(ad.y||0)/100*FULL_H+m.y+(imageM?imageM.y:0),w=bmp.width*scale,h=bmp.height*scale;ctx.save();ctx.globalAlpha=reveal*(imageM?imageM.a:1);");
html=html.replace("const center=540;if(ad.save){ctx.save();ctx.globalAlpha=badge;","const center=540;if(ad.save){ctx.save();ctx.globalAlpha=badge;applyVisualMotion(ctx,badgeM,center,193);");
html=html.replace("ctx.font='800 34px Cairo,Arial';","ctx.font='800 '+visualFs(ad,'badge',34)+'px Cairo,Arial';");
html=html.replace("ctx.save();ctx.translate(0,(1-reveal)*18);text(ctx,ad.en,center,555,fitSize(ctx,ad.en,880,100,54),'#f3d98d',reveal,false,'800');text(ctx,ad.ar,center,690,fitSize(ctx,ad.ar,880,72,46),'#c5a059',reveal,true,'700');ctx.restore();","ctx.save();ctx.translate(0,(1-reveal)*18);applyVisualMotion(ctx,titleM,center,620);text(ctx,ad.en,center,555,fitSize(ctx,ad.en,880,visualFs(ad,'en',100),30),'#f3d98d',reveal,false,'800');text(ctx,ad.ar,center,690,fitSize(ctx,ad.ar,880,visualFs(ad,'ar',72),28),'#c5a059',reveal,true,'700');ctx.restore();");
html=html.replace("ctx.save();ctx.translate(0,(1-price)*15);text(ctx,ad.oldPrice,center,1015,47,'#f5ead0',price,false,'600');","ctx.save();ctx.translate(0,(1-price)*15);applyVisualMotion(ctx,priceM,center,1200);text(ctx,ad.oldPrice,center,1015,visualFs(ad,'old',47),'#f5ead0',price,false,'600');");
html=html.replace("text(ctx,ad.price,0,0,182,'#f3d98d',price,false,'800');","text(ctx,ad.price,0,0,visualFs(ad,'price',182),'#f3d98d',price,false,'800');");
html=html.replace("text(ctx,ad.labelAr,center,1575,43,'#dbc783',footer,true,'700');text(ctx,ad.labelEn,center,1660,31,'#bba96e',footer,false,'600');","ctx.save();applyVisualMotion(ctx,footerM,center,1620);text(ctx,ad.labelAr,center,1575,visualFs(ad,'footerAr',43),'#dbc783',footer,true,'700');text(ctx,ad.labelEn,center,1660,visualFs(ad,'footerEn',31),'#bba96e',footer,false,'600');ctx.restore();");
html=html.replaceAll('PRODUCTION EXPORTER V8','PRODUCTION EXPORTER V12');html=html.replaceAll('Production MP4 Exporter V8','Production MP4 Exporter V12');html=html.replaceAll('Exporter V8','Exporter V12');
html=html.replace('V8 transition rule: each advertisement owns its own continuous timeline. The outgoing scene fades smoothly to black; the next scene then begins from its true frame 0. Image and main title use the same reveal clock.','V12: V11 zero-black/no-freeze transition engine plus per-ad typography and cinematic entrance controls. Default settings reproduce the approved V11 behaviour.');
html=html.replace('Deterministic frame renderer · fixed timeline · no DOM capture · no transition rewind','Deterministic frame renderer · V11 transitions · typography + motion controls');
html=html.replace('<div class="pill">IMAGE + TITLE SYNC</div>','<div class="pill">IMAGE + TITLE SYNC</div><div class="pill">TYPOGRAPHY + MOTION</div><div class="pill">ZERO BLACK / NO FREEZE</div>');
document.open();document.write(html);document.close();
}catch(err){document.body.innerHTML='<div class="boot"><div><b>V12 LOAD ERROR</b><span>'+String(err&&err.message||err)+'</span></div></div>';console.error(err)}})();
</script></body></html>
